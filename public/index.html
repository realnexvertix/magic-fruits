<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Magic Fruits</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #1e3a5f; font-family: Arial, sans-serif; user-select: none; }
  canvas { display: block; background: #87CEEB; }
  canvas.crosshair { cursor: crosshair; }
  #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 18px; text-shadow: 2px 2px 4px black; pointer-events: none; }
  #hint { position: absolute; top: 40px; left: 10px; color: white; font-size: 13px; text-shadow: 2px 2px 4px black; pointer-events: none; opacity: 0.8; line-height: 1.4; }
  #fsBtn { position: absolute; top: 10px; right: 300px; width: 44px; height: 44px; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.6); border-radius: 8px; color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #fsBtn:hover { background: rgba(255,255,255,0.2); border-color: #ffd700; }
  #authOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(135deg, #1a2a4a, #0a1a3a); display: flex; align-items: center; justify-content: center; z-index: 1000; font-family: Arial, sans-serif; }
  #authOverlay.hidden { display: none; }
  #authPanel { width: 420px; background: rgba(20,25,40,0.95); border: 3px solid rgba(255,215,0,0.6); border-radius: 16px; padding: 30px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  #authPanel h1 { color: #ffd700; margin: 0 0 8px; font-size: 34px; text-align: center; }
  #authPanel .subtitle { color: rgba(255,255,255,0.6); text-align: center; font-size: 14px; margin-bottom: 25px; }
  #authTabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.15); }
  .authTab { flex: 1; padding: 12px; text-align: center; color: rgba(255,255,255,0.5); cursor: pointer; font-weight: bold; font-size: 16px; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .authTab.active { color: #ffd700; border-bottom-color: #ffd700; }
  .authField { margin-bottom: 15px; }
  .authField label { display: block; color: rgba(255,255,255,0.75); font-size: 13px; margin-bottom: 6px; font-weight: bold; }
  .authField input { width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-size: 15px; }
  .authField input:focus { outline: none; border-color: #ffd700; }
  #authBtn { width: 100%; padding: 14px; background: linear-gradient(180deg, #4caf50, #2e7d32); border: none; border-radius: 8px; color: white; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #1b5e20; }
  #authBtn.login { background: linear-gradient(180deg, #2196f3, #1565c0); box-shadow: 0 4px 0 #0d47a1; }
  #authBtn:disabled { opacity: 0.6; cursor: wait; }
  #authError { color: #ff5555; text-align: center; font-size: 13px; min-height: 18px; margin-top: 10px; font-weight: bold; }
  #authHint { color: rgba(255,255,255,0.4); text-align: center; font-size: 11px; margin-top: 18px; }
  #logoutBtn { position: absolute; bottom: 10px; left: 10px; padding: 6px 12px; background: rgba(255,60,60,0.7); border: 2px solid rgba(255,255,255,0.4); border-radius: 6px; color: white; font-size: 12px; cursor: pointer; z-index: 10; display: none; }
  #logoutBtn:hover { background: rgba(255,60,60,0.95); }
  #playerName { position: absolute; bottom: 55px; left: 10px; padding: 8px 16px; background: rgba(0,0,0,0.55); border: 2px solid rgba(255,215,0,0.6); border-radius: 8px; color: #ffd700; font-size: 16px; font-weight: bold; z-index: 10; display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="fsBtn" title="Полный экран">⛶</button>
<div id="ui">🍎 Фрукты: <span id="fruitCount">0</span> | 💰 Монеты: <span id="moneyCount">0</span></div>
<div id="hint">WASD — движение | 1-5 — слоты | I — мешок | E — NPC | Tab — статистика | N N — админ<br><b>ЛКМ</b> — кулак | <b>Z / X / C / R / V</b> — способности | ⚠️ В море -30 HP/сек!</div>
<div id="playerName"></div>
<button id="logoutBtn">🚪 Выйти</button>

<div id="authOverlay">
  <div id="authPanel">
    <h1>🍎 Magic Fruits</h1>
    <div class="subtitle">Войди, чтобы сохранить прогресс</div>
    <div id="authTabs">
      <div class="authTab active" data-tab="login">Вход</div>
      <div class="authTab" data-tab="register">Регистрация</div>
    </div>
    <div class="authField"><label>👤 Никнейм</label><input type="text" id="authLogin" placeholder="Введи ник" maxlength="20" autocomplete="off"></div>
    <div class="authField"><label>🔒 Пароль</label><input type="password" id="authPassword" placeholder="Введи пароль" maxlength="30" autocomplete="off"></div>
    <button id="authBtn">Войти в игру</button>
    <div id="authError"></div>
    <div id="authHint">Прогресс сохраняется на сервере 💾</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

document.getElementById('fsBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
});

// ==================== АККАУНТЫ ====================
let currentUser = null;
const API = '/api';

// ==================== МУЛЬТИПЛЕЕР (состояние) ====================
let ws = null;
let wsConnected = false;
let myNetColor = '#ffb300';
const remotePlayers = new Map();

function updateMoneyUi() {
  document.getElementById('moneyCount').textContent = player.money;
}
function updateFruitUi() {
  document.getElementById('fruitCount').textContent = player.fruitCount;
}

function showAuth() {
  document.getElementById('authOverlay').classList.remove('hidden');
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('playerName').style.display = 'none';
}
function hideAuth() {
  document.getElementById('authOverlay').classList.add('hidden');
  document.getElementById('logoutBtn').style.display = 'block';
  document.getElementById('playerName').style.display = 'block';
  document.getElementById('playerName').textContent = '👤 ' + currentUser.username;
}
function showAuthError(m) {
  document.getElementById('authError').textContent = m;
  setTimeout(() => {
    if (document.getElementById('authError').textContent === m)
      document.getElementById('authError').textContent = '';
  }, 3500);
}

let authTab = 'login';
document.querySelectorAll('.authTab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.authTab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    authTab = t.dataset.tab;
    const b = document.getElementById('authBtn');
    b.textContent = authTab === 'login' ? 'Войти в игру' : 'Создать аккаунт';
    b.classList.toggle('login', authTab === 'register');
    document.getElementById('authError').textContent = '';
  });
});

document.getElementById('authBtn').addEventListener('click', async () => {
  const u = document.getElementById('authLogin').value.trim();
  const p = document.getElementById('authPassword').value;
  if (u.length < 3) return showAuthError('Ник минимум 3 символа');
  if (p.length < 3) return showAuthError('Пароль минимум 3 символа');
  const btn = document.getElementById('authBtn');
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = '⏳ Подожди...';
  try {
    const url = authTab === 'register' ? API + '/register' : API + '/login';
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const res = await r.json();
    if (!res.ok) { showAuthError(res.error); return; }
    loginAs(u, p, res.data);
  } catch (e) {
    showAuthError('Сервер не отвечает. Подожди 30 сек и попробуй снова');
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
});

document.getElementById('authPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('authBtn').click();
});

function loginAs(username, password, data) {
  currentUser = { username, password, data };
  try { localStorage.setItem('mf_session', JSON.stringify({ username, password })); } catch(e) {}
  hideAuth();
  applySave(data);
  showToast('👋 Привет, ' + username + '!');
  connectWebSocket();
}

function applySave(d) {
  if (!d) return;
  stats.level = d.level || 1;
  stats.xp = d.xp || 0;
  stats.statPoints = d.statPoints || 0;
  stats.points = d.points || { damage: 0, health: 0, fruit: 0 };
  waterMeter = d.waterMeter || 0;
  player.x = d.playerX || 0;
  player.y = d.playerY || 0;
  player.hp = d.hp || getMaxHp();
  player.stamina = d.stamina || getMaxStamina();
  player.fruitCount = d.fruitCount || 0;
  player.money = d.money || 0;
  rollCooldownUntil = d.rollCooldownUntil || 0;
  updateFruitUi();
  updateMoneyUi();
  if (Array.isArray(d.inventory)) for (let i = 0; i < INVENTORY_SLOTS; i++) inventory[i] = d.inventory[i] || null;
  bag.length = 0;
  if (Array.isArray(d.bag)) for (const it of d.bag) bag.push(it);
  if (d.quest) quest.active = d.quest;
  camera.x = player.x - canvas.width / 2;
  camera.y = player.y - canvas.height / 2;
}

let saving = false;
async function saveNow() {
  if (!currentUser || saving) return;
  saving = true;
  const data = {
    level: stats.level, xp: stats.xp, statPoints: stats.statPoints,
    points: { ...stats.points }, waterMeter,
    playerX: player.x, playerY: player.y,
    hp: player.hp, stamina: player.stamina,
    fruitCount: player.fruitCount,
    money: player.money,
    rollCooldownUntil: rollCooldownUntil,
    inventory: inventory.map(i => i ? { ...i } : null),
    bag: bag.map(i => ({ ...i })),
    quest: quest.active
  };
  try {
    await fetch(API + '/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: currentUser.username, password: currentUser.password, data })
    });
  } catch (e) {}
  saving = false;
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await saveNow();
  try { if (ws) ws.close(); } catch (e) {}
  ws = null;
  try { localStorage.removeItem('mf_session'); } catch(e) {}
  location.reload();
});

setInterval(saveNow, 15000);
window.addEventListener('beforeunload', saveNow);

(async function() {
  try {
    const s = localStorage.getItem('mf_session');
    if (s) {
      const { username, password } = JSON.parse(s);
      const r = await fetch(API + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const res = await r.json();
      if (res.ok) return loginAs(username, password, res.data);
    }
  } catch(e) {}
  showAuth();
})();

// ==================== МУЛЬТИПЛЕЕР (клиент) ====================
function connectWebSocket() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try {
    ws = new WebSocket(proto + '//' + location.host);
  } catch (e) {
    setTimeout(connectWebSocket, 3000);
    return;
  }

  ws.onopen = () => {
    try {
      ws.send(JSON.stringify({
        type: 'hello',
        username: currentUser.username,
        password: currentUser.password
      }));
    } catch (e) {}
  };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleWsMessage(msg);
  };

  ws.onclose = () => {
    wsConnected = false;
    ws = null;
    remotePlayers.clear();
    if (currentUser) setTimeout(connectWebSocket, 3000);
  };

  ws.onerror = () => {};
}

function mkRemote(p) {
  return {
    u: p.u,
    x: p.x, y: p.y,
    targetX: p.x, targetY: p.y,
    lx: (typeof p.lx === 'number' ? p.lx : 1),
    ly: (typeof p.ly === 'number' ? p.ly : 0),
    hp: (typeof p.hp === 'number' ? p.hp : 100),
    mhp: (typeof p.mhp === 'number' ? p.mhp : 100),
    color: p.c || '#ffb300',
    waterForm: !!p.wf,
    hitFlash: 0,
    punchAnim: 0
  };
}

function handleWsMessage(msg) {
  if (msg.type === 'hello_ok') {
    wsConnected = true;
    myNetColor = msg.you && msg.you.c ? msg.you.c : '#ffb300';
    remotePlayers.clear();
    if (Array.isArray(msg.players)) {
      for (const p of msg.players) remotePlayers.set(p.u, mkRemote(p));
    }
    syncPositionNow();
    showToast('🌐 Подключено к серверу (' + remotePlayers.size + ' онлайн)');
    return;
  }
  if (msg.type === 'hello_err') {
    showToast('❌ Мультиплеер: ' + (msg.error || 'ошибка авторизации'));
    return;
  }
  if (msg.type === 'join') {
    remotePlayers.set(msg.u, mkRemote(msg));
    showToast('👋 ' + msg.u + ' зашёл в игру');
    return;
  }
  if (msg.type === 'leave') {
    if (remotePlayers.has(msg.u)) remotePlayers.delete(msg.u);
    return;
  }
  if (msg.type === 'pos') {
    const rp = remotePlayers.get(msg.u);
    if (rp) {
      rp.targetX = msg.x;
      rp.targetY = msg.y;
      rp.lx = msg.lx;
      rp.ly = msg.ly;
      rp.hp = msg.hp;
      rp.mhp = msg.mhp;
      rp.waterForm = !!msg.wf;
    } else {
      remotePlayers.set(msg.u, mkRemote({
        u: msg.u, x: msg.x, y: msg.y, lx: msg.lx, ly: msg.ly,
        hp: msg.hp, mhp: msg.mhp, c: msg.c, wf: msg.wf
      }));
    }
    return;
  }
  if (msg.type === 'hurt') {
    player.hp = Math.max(0, msg.hp);
    player.hitFlash = 12;
    player.lastDamageTime = performance.now();
    damageNumbers.push({
      x: player.x, y: player.y - player.radius,
      vy: -1.6, life: 60, maxLife: 60,
      text: '-' + msg.dmg, color: '#ff4444'
    });
    showToast('💥 ' + msg.from + ' ударил тебя (-' + msg.dmg + ' HP)');
    if (player.hp <= 0) showToast('💀 Ты убит игроком ' + msg.from);
    return;
  }
  if (msg.type === 'hitfx') {
    spawnImpactEffect(msg.x, msg.y);
    damageNumbers.push({
      x: msg.x, y: msg.y - 30,
      vy: -1.6, life: 60, maxLife: 60,
      text: '-' + msg.dmg, color: '#ffdd00'
    });
    const rp = remotePlayers.get(msg.target);
    if (rp) rp.hitFlash = 12;
    return;
  }
  if (msg.type === 'kill') {
    showToast('☠️ ' + msg.from + ' убил ' + msg.target);
    return;
  }
  if (msg.type === 'respawn') {
    player.x = msg.x;
    player.y = msg.y;
    player.hp = msg.hp || getMaxHp();
    player.invulnUntil = performance.now() + 1500;
    showToast('🛡 Респавн');
    return;
  }
}

function syncPositionNow() {
  if (!ws || ws.readyState !== 1 || !currentUser) return;
  try {
    ws.send(JSON.stringify({
      type: 'move',
      x: Math.round(player.x),
      y: Math.round(player.y),
      lx: +player.lookX.toFixed(2),
      ly: +player.lookY.toFixed(2),
      hp: Math.round(player.hp),
      mhp: getMaxHp(),
      wf: isInWaterForm()
    }));
  } catch (e) {}
}

setInterval(syncPositionNow, 50);

function sendHit(targetUsername, dmg, kind) {
  if (!ws || ws.readyState !== 1) return;
  try {
    ws.send(JSON.stringify({
      type: 'hit',
      target: targetUsername,
      dmg: Math.max(1, Math.round(dmg)),
      kind: kind === 'ranged' ? 'ranged' : 'melee'
    }));
  } catch (e) {}
}

// ==================== МИР ====================
const camera = { x: 0, y: 0 };
const ISLAND = { x: -1200, y: -900, width: 2400, height: 1800 };
const BEACH_WIDTH = 120;

const obstacles = [];
function addHouse(x, y, w, h, wc, rc) { obstacles.push({ type: 'house', x, y, w, h, wallColor: wc, roofColor: rc }); }
function addTree(x, y, size = 1) { obstacles.push({ type: 'tree', x, y, r: 20 * size, trunkR: 8 * size }); }
function addBarrel(x, y) { obstacles.push({ type: 'barrel', x, y, r: 14 }); }
function addFence(x, y, w, h) { obstacles.push({ type: 'fence', x, y, w, h }); }

addHouse(-900, -600, 160, 120, '#c9a877', '#8b3a2a');
addHouse(-600, -750, 180, 140, '#b89b6a', '#5a3a2a');
addHouse(-300, -550, 150, 130, '#c9a877', '#7a4a3a');
addHouse(100, -700, 200, 150, '#a88a5a', '#4a3a2a');
addTree(-1000, -200, 1.2); addTree(-850, -100, 1.0); addTree(-700, -150, 1.3);
addTree(-500, -50, 0.9); addTree(-350, -100, 1.1); addTree(-200, 0, 1.4);
addTree(0, -100, 1.0); addTree(200, -50, 1.2); addTree(400, -150, 1.0);
addTree(600, 0, 1.3); addTree(800, 100, 1.1); addTree(-900, 200, 1.2);
addTree(-600, 300, 1.0); addTree(-300, 400, 1.1); addTree(100, 350, 1.3);
addTree(500, 400, 1.0); addTree(900, 300, 1.2);
addBarrel(-800, -500); addBarrel(-770, -490); addBarrel(-450, -650);
addBarrel(-420, -630); addBarrel(-100, -450); addBarrel(250, -600);
addFence(-950, -550, 200, 10); addFence(-550, -680, 10, 200); addFence(150, -650, 10, 250);

// ==================== ХОТБАР ====================
const INVENTORY_SLOTS = 5;
const POWER_SLOT_INDEX = 1;
const FRUIT_GIVE_SLOT = 4; // 5-й слот (индекс 4)
const inventory = new Array(INVENTORY_SLOTS).fill(null);
inventory[0] = { type: 'fists', name: 'Кулаки' };
let heldSlot = 0;
const bag = [];
let bagOpen = false;
let abilityGuide = null;
let statsOpen = false;

// ==================== СПОСОБНОСТИ ====================
const FIRE_ABILITIES = [
  { id: 'fire_charge', name: 'Огненный заряд', key: 'Z', requiredMastery: 0, cooldown: 15, stamina: 10, damage: 10, description: 'Огненный шар · 10 урона · кд 15с' },
  { id: 'flame_dash', name: 'Рывок пламени', key: 'X', requiredMastery: 10, cooldown: 6, stamina: 25, damage: 0, description: 'Рывок вперёд · кд 6с' }
];
const ICE_ABILITIES = [
  { id: 'ice_spear', name: 'Ледяное копьё', key: 'Z', requiredMastery: 0, cooldown: 14, stamina: 15, damage: 6.5, description: 'Копьё · 6.5 урона · кд 14с' },
  { id: 'ice_prison', name: 'Ледяная тюрьма', key: 'X', requiredMastery: 15, cooldown: 5, stamina: 40, damage: 12, description: 'Зона заморозки · 12 урона · кд 5с' },
  { id: 'ice_meteor', name: 'Метеоритный лёд', key: 'C', requiredMastery: 40, cooldown: 25, stamina: 60, damage: 20, description: 'Глыба с неба · 20 урона · кд 25с' }
];
const SHARK_ABILITIES = [
  { id: 'shark_bite', name: 'Акулий укус', key: 'Z', requiredMastery: 0, cooldown: 15, stamina: 20, damage: 15, description: 'Акула бросается · 15 урона · кд 15с' },
  { id: 'shark_torrent', name: 'Поток акул', key: 'X', requiredMastery: 15, cooldown: 20, stamina: 45, damage: 5, description: 'Веер из 5 акул · 5 урона каждая · кд 20с' },
  { id: 'shark_whirlpool', name: 'Водоворот', key: 'C', requiredMastery: 40, cooldown: 30, stamina: 55, damage: 27, description: 'Водоворот · 27 урона · кд 30с' },
  { id: 'shark_transform', name: 'Трансформация', key: 'R', requiredMastery: 0, cooldown: 0, stamina: 0, damage: 0, description: 'Нужна шкала воды. 90с водного облика', usesWaterMeter: true }
];
const CONTROL_ABILITIES = [
  { id: 'control_zone', name: 'Купол Контроля', key: 'Z', requiredMastery: 0, cooldown: 20, stamina: 25, damage: 0, description: 'Зона радиуса 220 · 15с · никто не выйдет', requiresZone: false, noAim: true },
  { id: 'control_laser', name: 'Лазерная пицца', key: 'X', requiredMastery: 0, cooldown: 45, stamina: 20, damage: 22, description: '8 лучей по 22 урона · только в зоне', requiresZone: true, noAim: true },
  { id: 'control_meteor', name: 'Метеорит', key: 'C', requiredMastery: 0, cooldown: 60, stamina: 40, damage: 35, description: '35 урона в центре · 2 в зоне · кд 60с', requiresZone: true, aiming: true },
  { id: 'control_beam', name: 'Синий Луч', key: 'V', requiredMastery: 0, cooldown: 90, stamina: 60, damage: 70, description: '70 урона через 2с · кд 90с', requiresZone: true, aiming: true }
];

function getAbilitiesFor(name) {
  if (name === 'Огонь') return FIRE_ABILITIES;
  if (name === 'Лёд') return ICE_ABILITIES;
  if (name === 'Акула') return SHARK_ABILITIES;
  if (name === 'Контроль') return CONTROL_ABILITIES;
  return [];
}

// Редкости фруктов
const FRUIT_RARITY = {
  'Огонь': 'common',
  'Лёд': 'uncommon',
  'Акула': 'legendary',
  'Контроль': 'mythic'
};
function getFruitRarity(name) {
  return FRUIT_RARITY[name] || 'common';
}
function getRarityLabel(rar) {
  if (rar === 'common') return '⚪ Обычный';
  if (rar === 'uncommon') return '🟢 Необычный';
  if (rar === 'rare') return '🔵 Редкий';
  if (rar === 'legendary') return '🟡 Легендарный';
  if (rar === 'mythic') return '🔴 Мифический';
  return '⚪ Обычный';
}

// ==================== СТАТИСТИКА ====================
const MAX_LEVEL = 20;
const XP_BASE = 70;
const XP_MULTIPLIER = 1.2;
const stats = { level: 1, xp: 0, statPoints: 0, points: { damage: 0, health: 0, fruit: 0 } };
function xpForNextLevel(l) { return Math.floor(XP_BASE * Math.pow(XP_MULTIPLIER, l - 1)); }
const pendingXp = [];

function addXp(amount) {
  if (stats.level >= MAX_LEVEL) return;
  stats.xp += amount;
  let leveledUp = false;
  let guard = 0;
  while (stats.level < MAX_LEVEL && guard < 50) {
    guard++;
    const need = xpForNextLevel(stats.level);
    if (stats.xp >= need) {
      stats.xp -= need;
      stats.level++;
      stats.statPoints += 3;
      leveledUp = true;
    } else break;
  }
  if (stats.level >= MAX_LEVEL) stats.xp = 0;
  if (leveledUp) {
    spawnLevelUpEffect(player.x, player.y);
    showToast('🎉 УРОВЕНЬ ' + stats.level + '! +3 очка');
  }
}

function spawnLevelUpEffect(x, y) {
  for (let i = 0; i < 50; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 3 + Math.random() * 6;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 60, maxLife: 90, radius: 4 + Math.random() * 5,
      color: Math.random() < 0.5 ? '#ffdd44' : '#ffffff' });
  }
}

function getDamageMultiplier() { return Math.pow(1.1, Math.floor(stats.points.damage / 3)); }
function getFruitDamageMultiplier() { return Math.pow(1.1, Math.floor(stats.points.fruit / 3)); }
function getBonusStamina() { return Math.floor(stats.points.damage / 2) * 5; }
function getBonusHp() { return stats.points.health * 5; }
function getMaxHp() { return 100 + getBonusHp(); }
function getMaxStamina() { return 100 + getBonusStamina(); }

// ==================== КОЛЛИЗИИ ====================
function isOnIsland(x, y) {
  return x >= ISLAND.x && x <= ISLAND.x + ISLAND.width && y >= ISLAND.y && y <= ISLAND.y + ISLAND.height;
}
function canBeAt(x, y, r) {
  for (const ob of obstacles) {
    if (ob.type === 'house' || ob.type === 'fence') {
      const nx = Math.max(ob.x, Math.min(x, ob.x + ob.w));
      const ny = Math.max(ob.y, Math.min(y, ob.y + ob.h));
      if ((x - nx) ** 2 + (y - ny) ** 2 < r * r) return false;
    } else {
      if ((x - ob.x) ** 2 + (y - ob.y) ** 2 < (ob.r + r) ** 2) return false;
    }
  }
  return true;
}
function tryMove(ent, dx, dy) {
  if (canBeAt(ent.x + dx, ent.y, ent.radius)) ent.x += dx;
  if (canBeAt(ent.x, ent.y + dy, ent.radius)) ent.y += dy;
}
// Проверка, заперт ли игрок внутри зоны контроля
function isInControlZone(x, y) {
  for (const z of controlZones) {
    if (Math.hypot(x - z.x, y - z.y) < z.radius) return z;
  }
  return null;
}
// Движение игрока с учётом зоны (если внутри — не выпускать)
function tryMovePlayer(dx, dy) {
  const zone = isInControlZone(player.x, player.y);
  if (!zone) {
    tryMove(player, dx, dy);
    return;
  }
  // пробуем двигаться, но не выходить за радиус
  const nx = player.x + dx;
  const ny = player.y + dy;
  // если новая точка вне зоны — обрезаем по окружности
  if (Math.hypot(nx - zone.x, ny - zone.y) > zone.radius - player.radius * 0.5) {
    // двигаемся только если остаёмся внутри
    // проецируем позицию на границу (мягкий блок)
    const angle = Math.atan2(player.y - zone.y, player.x - zone.x);
    const maxR = zone.radius - player.radius * 0.5;
    const bx = zone.x + Math.cos(angle) * maxR;
    const by = zone.y + Math.sin(angle) * maxR;
    if (canBeAt(bx, by, player.radius)) { player.x = bx; player.y = by; }
    return;
  }
  tryMove(player, dx, dy);
}

    const oldPower = inventory[POWER_SLOT_INDEX];
    if (oldPower && oldPower.type === 'power') {

    }
    inventory[POWER_SLOT_INDEX] = { type: 'power', name: item.name, color: item.color, mastery: 0 };

}

// ==================== КУЛАК ====================
function punchFist() {
  if (heldSlot === -1) return;
  const item = inventory[heldSlot];
  if (!item || item.type !== 'fists') return;
  if (player.punchCooldown > 0) return;
  if (player.stamina < 3) return;
  player.punchCooldown = 0.28;
  player.stamina = Math.max(0, player.stamina - 3);
  player.punchAnim = 1;
  let dx = player.lookX, dy = player.lookY;
  if (dx === 0 && dy === 0) { dx = 1; dy = 0; }
  const dl = Math.hypot(dx, dy); dx /= dl; dy /= dl;
  player.punchDir = { x: dx, y: dy };
  const px = player.x + dx * 55, py = player.y + dy * 55;
  const hr = 40;
  let dm = getDamageMultiplier();
  if (isInWaterForm()) dm *= 1.2;
  const f = Math.max(1, Math.round(5 * dm));
  for (const pir of pirates) {
    if (pir.dead) continue;
    if (Math.hypot(pir.x - px, pir.y - py) < hr) { damagePirate(pir, f, px, py); pir.chasing = true; }
  }
  if (Math.hypot(npc.x - px, npc.y - py) < hr) damageNpc(f);

  for (const rp of remotePlayers.values()) {
    if (Math.hypot(rp.x - px, rp.y - py) < hr + player.radius) {
      sendHit(rp.u, f, 'melee');
      spawnImpactEffect(rp.x, rp.y);
    }
  }

  for (let i = 0; i < 8; i++) {
    const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.2;
    const s = 3 + Math.random() * 3;
    particles.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 15, maxLife: 15, radius: 3, color: '#cccccc' });
  }
}

function activateWaterTransform() {
  if (waterMeter < WATER_METER_MAX) { showToast(`Нужна полная шкала воды! (${Math.floor(waterMeter)}/100)`); return; }
  waterMeter = 0;
  player.waterFormUntil = performance.now() + TRANSFORM_DURATION;
  for (let i = 0; i < 80; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 3 + Math.random() * 8;
    particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 60 + Math.random() * 40, maxLife: 100, radius: 4 + Math.random() * 6,
      color: Math.random() < 0.4 ? '#ffffff' : (Math.random() < 0.7 ? '#4fd4ff' : '#0a3a6c') });
  }
  particles.push({ isShockwave: true, x: player.x, y: player.y, radius: 10, maxRadius: 200, life: 40, maxLife: 40, color: '#4fd4ff' });
  showToast('🌊 ВОДНЫЙ ОБЛИК! 90 секунд');
}

function startAbility(powerName, abilityId) {
  const held = getHeldPower();
  if (!held || held.power.name !== powerName) { showToast(`Возьми ${powerName} в руки!`); return; }
  const ab = held.abilities.find(a => a.id === abilityId);
  if (!ab) return;
  if (held.power.mastery < ab.requiredMastery) { showToast(`Нужно ${ab.requiredMastery} mastery!`); return; }
  if (ab.usesWaterMeter) { activateWaterTransform(); return; }

  // Запрет использовать другие способности внутри зоны контроля
  const inZone = isInControlZone(player.x, player.y);
  if (inZone && powerName !== 'Контроль') {
    showToast('❌ В зоне контроля нельзя использовать другие способности!');
    return;
  }

  // Для способностей, требующих зону — проверяем что своя зона существует
  if (ab.requiresZone) {
    const mine = getMyControlZone();
    if (!mine) {
      showToast('❌ Нужно создать купол (Z), чтобы использовать это!');
      return;
    }
    // И что игрок внутри своей зоны
    if (Math.hypot(player.x - mine.x, player.y - mine.y) > mine.radius) {
      showToast('❌ Ты должен быть внутри своего купола!');
      return;
    }
  }

  if ((player.cooldowns[abilityId] || 0) > 0) return;
  if (player.stamina < ab.stamina) { showToast('Мало стамины!'); return; }

  if (ab.noAim) {
    // Z, X — без прицела, сразу
    executeAbilityAt(player.x, player.y);
    return;
  }
  if (ab.aiming) {
    // C, V — включаем прицел
    if (abilityId === 'control_meteor') {
      controlAim = { abilityId: 'control_meteor', radius: 120, color: 'rgba(255,100,50,0.85)' };
      showToast('🎯 Кликни куда упадёт метеорит');
      return;
    }
    if (abilityId === 'control_beam') {
      controlAim = { abilityId: 'control_beam', radius: 200, color: 'rgba(80,180,255,0.85)' };
      showToast('🎯 Кликни куда ударит луч');
      return;
    }
  }
  // Фоллбэк
  aimingAbility = { powerName, abilityId, ability: ab };
  showToast('Кликни по цели');
}

function executeAbilityAt(tx, ty) {
  // Сначала — контроль-способности (у них особый поток)
  const held = getHeldPower();
  if (held && held.power.name === 'Контроль') {
    executeControlAbility(tx, ty);
    return;
  }

  if (!aimingAbility) return;
  const { powerName, abilityId, ability } = aimingAbility;
  const dx = tx - player.x, dy = ty - player.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 1) { aimingAbility = null; return; }
  const nx = dx / dist, ny = dy / dist;
  player.cooldowns[abilityId] = ability.cooldown;
  player.stamina = Math.max(0, player.stamina - ability.stamina);
  let powerMult = 1, fruitMult = getFruitDamageMultiplier();
  if (isInWaterForm()) { powerMult = 1.2; fruitMult *= 1.2; }
  const finalDmg = ability.damage * fruitMult;

  if (abilityId === 'fire_charge') {
    projectiles.push({ kind: 'fireball', x: player.x + nx * (player.radius + 10), y: player.y + ny * (player.radius + 10), vx: nx * 12, vy: ny * 12, radius: 14, life: 90, damage: finalDmg, trail: [], pierced: new Set() });
  } else if (abilityId === 'flame_dash') {
    const maxDist = 400 * powerMult;
    let fx = tx, fy = ty;
    if (dist > maxDist) { fx = player.x + nx * maxDist; fy = player.y + ny * maxDist; }
    const steps = 14;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const px = player.x + (fx - player.x) * t, py = player.y + (fy - player.y) * t;
      dashTrail.push({ x: px, y: py, life: 30, maxLife: 30, radius: player.radius });
      for (let k = 0; k < 3; k++) {
        particles.push({ x: px + (Math.random() - 0.5) * 20, y: py + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3 - 1,
          life: 30 + Math.random() * 15, maxLife: 45, radius: 4 + Math.random() * 5,
          color: Math.random() < 0.4 ? '#ffdd00' : (Math.random() < 0.7 ? '#ff6600' : '#ff2200') });
      }
    }
    if (canBeAt(fx, fy, player.radius)) { player.x = fx; player.y = fy; }
  } else if (abilityId === 'ice_spear') {
    projectiles.push({ kind: 'ice_spear', x: player.x + nx * (player.radius + 10), y: player.y + ny * (player.radius + 10), vx: nx * 15, vy: ny * 15, radius: 12, life: 80, damage: finalDmg, trail: [], pierced: new Set(), angle: Math.atan2(ny, nx) });
  } else if (abilityId === 'ice_prison') {
    const maxDist = 500;
    let fx = tx, fy = ty;
    if (dist > maxDist) { fx = player.x + nx * maxDist; fy = player.y + ny * maxDist; }
    iceZones.push({ x: fx, y: fy, radius: 0, maxRadius: 120, life: 180, maxLife: 180, freezeDuration: 3000, damage: finalDmg, applied: false, shards: [] });
  } else if (abilityId === 'ice_meteor') {
    meteors.push({ targetX: tx, targetY: ty, x: tx, y: ty - 900, fallProgress: 0, duration: 36, radius: 60, damage: finalDmg, impactDone: false });
  } else if (abilityId === 'shark_bite') {
    sharkBites.push({ kind: 'bite', x: player.x + nx * (player.radius + 20), y: player.y + ny * (player.radius + 20), vx: nx * 14, vy: ny * 14, angle: Math.atan2(ny, nx), radius: 30, life: 50, damage: finalDmg, trail: [], pierced: new Set() });
  } else if (abilityId === 'shark_torrent') {
    const ba = Math.atan2(ny, nx);
    for (let i = -2; i <= 2; i++) {
      const a = ba + i * 0.22;
      sharkBites.push({ kind: 'torrent', x: player.x + Math.cos(a) * (player.radius + 20), y: player.y + Math.sin(a) * (player.radius + 20), vx: Math.cos(a) * 12, vy: Math.sin(a) * 12, angle: a, radius: 22, life: 60, damage: finalDmg, trail: [], pierced: new Set() });
    }
  } else if (abilityId === 'shark_whirlpool') {
    const maxDist = 450;
    let fx = tx, fy = ty;
    if (dist > maxDist) { fx = player.x + nx * maxDist; fy = player.y + ny * maxDist; }
    whirlpools.push({ x: fx, y: fy, radius: 0, maxRadius: 140, life: 360, maxLife: 360, damage: finalDmg, tickTimer: 0, rotation: 0, tentacleArms: 8, tentacleTimer: 0, grabbed: new Map(), damagedOnce: new Set() });
  }
  aimingAbility = null;
}

// ==================== КОНТРОЛЬ-СПОСОБНОСТИ ====================
function executeControlAbility(tx, ty) {
  const ab = CONTROL_ABILITIES.find(a => (player.cooldowns[a.id] || 0) <= 0 &&
    ((a.noAim && a.id === 'control_zone') || (controlAim && a.id === controlAim.abilityId)));
  // Определяем какую именно способность сейчас применяем:
  let ability = null;
  if (controlAim) {
    ability = CONTROL_ABILITIES.find(a => a.id === controlAim.abilityId);
  } else {
    // Z нажали — сразу выполнение
    ability = CONTROL_ABILITIES.find(a => a.id === 'control_zone');
  }
  if (!ability) { controlAim = null; return; }

  // Проверки
  if ((player.cooldowns[ability.id] || 0) > 0) { controlAim = null; return; }
  if (player.stamina < ability.stamina) { showToast('Мало стамины!'); controlAim = null; return; }

  // Для X/Y/C/V — надо быть в своей зоне
  if (ability.requiresZone) {
    const mine = getMyControlZone();
    if (!mine || Math.hypot(player.x - mine.x, player.y - mine.y) > mine.radius) {
      showToast('❌ Ты должен быть внутри своего купола!');
      controlAim = null;
      return;
    }
  }

  player.cooldowns[ability.id] = ability.cooldown;
  player.stamina = Math.max(0, player.stamina - ability.stamina);

  if (ability.id === 'control_zone') {
    // Ставим купол по центру игрока
    controlZones.push({
      x: player.x, y: player.y,
      radius: 220,
      life: 900, maxLife: 900, // 15 сек * 60
      owner: currentUser.username
    });
    showToast('🌀 Купол контроля создан!');
    spawnZoneEffect(player.x, player.y, 220);
  } else if (ability.id === 'control_laser') {
    // 8 лучей по 22 урона, из центра зоны
    const zone = getMyControlZone();
    if (!zone) { controlAim = null; return; }
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      controlLasers.push({
        cx: zone.x, cy: zone.y,
        angle,
        len: zone.radius,
        life: 40, maxLife: 40,
        damage: ability.damage,
        hits: new Set()
      });
    }
    spawnZoneEffect(zone.x, zone.y, zone.radius);
    showToast('⚡ Лазерная пицца!');
  } else if (ability.id === 'control_meteor') {
    const zone = getMyControlZone();
    if (!zone) { controlAim = null; return; }
    controlMeteors.push({
      targetX: tx, targetY: ty,
      x: tx, y: ty - 900,
      fallProgress: 0, duration: 40,
      radius: 120,
      damage: ability.damage,
      impactDone: false,
      zoneX: zone.x, zoneY: zone.y, zoneR: zone.radius
    });
    spawnZoneEffect(zone.x, zone.y, zone.radius);
    showToast('☄️ Метеорит летит!');
  } else if (ability.id === 'control_beam') {
    const zone = getMyControlZone();
    if (!zone) { controlAim = null; return; }
    controlBeams.push({
      x: tx, y: ty,
      radius: 200,
      life: 120, maxLife: 120, // 2 секунды до активации + 0.5с после
      damage: ability.damage,
      activated: false,
      hitDone: false,
      zoneX: zone.x, zoneY: zone.y, zoneR: zone.radius
    });
    spawnZoneEffect(zone.x, zone.y, zone.radius);
    showToast('🔵 Луч заряжается 2 секунды...');
  }
  controlAim = null;
}

function spawnZoneEffect(x, y, radius) {
  particles.push({ isShockwave: true, x, y, radius: 10, maxRadius: radius, life: 40, maxLife: 40, color: '#5ac8ff' });
}

// ==================== УРОН ====================
function formatDmg(d) { if (d >= 10) return String(Math.round(d)); if (Number.isInteger(d)) return String(d); return d.toFixed(1); }

function damagePirate(pirate, dmg) {
  if (pirate.dead) return;
  pirate.hp = Math.max(0, pirate.hp - dmg);
  pirate.hitFlash = 10;
  pirate.chasing = true;
  damageNumbers.push({ x: pirate.x, y: pirate.y - pirate.radius, vy: -1.6, life: 60, maxLife: 60, text: formatDmg(dmg), color: '#ffdd00' });
  if (pirate.hp <= 0 && !pirate.dead) {
    pirate.dead = true;
    pirate.deathTimer = 40;
    pirate.respawnAt = performance.now() + PIRATE_RESPAWN_TIME;
    const held = getHeldPower();
    if (held) { held.power.mastery += PIRATE_MASTERY_REWARD; showToast(`+${PIRATE_MASTERY_REWARD} mastery`); }
    waterMeter = Math.min(WATER_METER_MAX, waterMeter + WATER_METER_PER_KILL);
    pendingXp.push(PIRATE_XP_REWARD);
    player.money += PIRATE_COIN_REWARD;
    updateMoneyUi();
    damageNumbers.push({ x: pirate.x, y: pirate.y - pirate.radius - 20, vy: -1.4, life: 60, maxLife: 60, text: '+' + PIRATE_COIN_REWARD + '💰', color: '#ffd700' });
    if (quest.active) {
      quest.active.current++;
      if (quest.active.current >= quest.active.target) {
        pendingXp.push(quest.active.rewardXp);
        player.money += 200;
        updateMoneyUi();
        showToast('✅ КВЕСТ ВЫПОЛНЕН! +200 💰');
        damageNumbers.push({ x: player.x, y: player.y - player.radius - 20, vy: -1.4, life: 90, maxLife: 90, text: '+200💰', color: '#ffd700' });
        quest.active = null;
      }
    }
    for (let k = 0; k < 25; k++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 5;
      particles.push({ x: pirate.x, y: pirate.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 40, maxLife: 40, radius: 3 + Math.random() * 4, color: '#aa0000' });
    }
    saveNow();
  }
}

function damageNpc(dmg) {
  npc.hp = Math.max(0, npc.hp - dmg);
  npc.hitFlash = 10;
  npc.shakeUntil = performance.now() + 150;
  damageNumbers.push({ x: npc.x, y: npc.y - npc.radius, vy: -1.6, life: 60, maxLife: 60, text: formatDmg(dmg), color: '#ffdd00' });
}

function damagePlayer(dmg) {
  if (performance.now() < player.invulnUntil) return;
  if (isInWaterForm()) dmg = Math.max(1, Math.floor(dmg * 0.8));
  player.hp = Math.max(0, player.hp - dmg);
  player.hitFlash = 12;
  player.invulnUntil = performance.now() + 400;
  player.lastDamageTime = performance.now();
  damageNumbers.push({ x: player.x, y: player.y - player.radius, vy: -1.6, life: 60, maxLife: 60, text: '-' + dmg, color: '#ff4444' });
  if (player.hp <= 0) { showToast('Ты погиб!'); player.hp = getMaxHp(); player.x = 0; player.y = 0; }
}

function applySeaDamage() {
  if (!isOnIsland(player.x, player.y) && !isInWaterForm()) {
    player.hp = Math.max(0, player.hp - 30);
    player.lastDamageTime = performance.now();
    damageNumbers.push({ x: player.x, y: player.y - player.radius, vy: -1.6, life: 60, maxLife: 60, text: '-30 💧', color: '#44aaff' });
    for (let k = 0; k < 15; k++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 4;
      particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 30, maxLife: 30, radius: 3, color: '#4fd4ff' });
    }
    if (player.hp <= 0) { showToast('🌊 Ты утонул!'); player.hp = getMaxHp(); player.x = 0; player.y = 0; }
  }
}

// ==================== КЛИКИ ====================
canvas.addEventListener('click', (e) => {
  if (!currentUser) return;
  if (adminOpen) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (questDialogOpen) { handleQuestDialogClick(mx, my); return; }
  if (rollDialogOpen) { handleRollDialogClick(mx, my); return; }
  if (statsOpen) { handleStatsClick(mx, my); return; }

  // Прицел контроля C / V
  if (controlAim) {
    const wx = mx + camera.x, wy = my + camera.y;
    executeControlAbility(wx, wy);
    return;
  }

  if (aimingAbility) { executeAbilityAt(mx + camera.x, my + camera.y); return; }
  if (bagOpen) { handleBagClick(mx, my); return; }
  if (contextMenu) {
    for (const btn of contextMenu.buttons) {
      if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) { executeMenuAction(btn.action); return; }
    }
    contextMenu = null; return;
  }
  if (isClickOnInvButton(mx, my)) { bagOpen = !bagOpen; return; }
  const si = getSlotAtPoint(mx, my);
  if (si !== -1) {
    const item = inventory[si];
    if (!item) return;
    if (item.type === 'power') {
      if (heldSlot === si && abilityGuide && abilityGuide.slotIndex === si) { heldSlot = -1; abilityGuide = null; }
      else { heldSlot = si; abilityGuide = { slotIndex: si, name: item.name, color: item.color, abilities: getAbilitiesFor(item.name) }; }
      contextMenu = null; return;
    }
    heldSlot = (heldSlot === si) ? -1 : si;
    if (heldSlot === -1 || (inventory[heldSlot] && inventory[heldSlot].type !== 'power')) abilityGuide = null;
    contextMenu = null; return;
  }
  if (heldSlot !== -1) {
    const held = inventory[heldSlot];
    if (held && held.type === 'fists') { punchFist(); return; }
    if (held && held.type === 'fruit') { openContextMenu(); return; }
  }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

  if (mx >= b.roll.x && mx <= b.roll.x + b.roll.w && my >= b.roll.y && my <= b.roll.y + b.roll.h) {

function tryRollFruit() {
  if (stats.level < ROLL_MIN_LEVEL) {
    showToast(`❌ Нужен ${ROLL_MIN_LEVEL} уровень (у тебя ${stats.level})`);
    return;
  }
  const now = Date.now();
  if (now < rollCooldownUntil) {
    const rem = Math.ceil((rollCooldownUntil - now) / 1000);
    const m = Math.floor(rem / 60);
    const s = rem % 60;
    showToast(`⏳ Перезарядка: ${m}:${String(s).padStart(2, '0')}`);
    return;
  }
  const cost = getRollCost();
  if (player.money < cost) {
    showToast(`❌ Нужно ${cost} 💰 (у тебя ${player.money})`);
    return;
  }
  player.money -= cost;
  updateMoneyUi();

  const roll = Math.random() * 100;
  let rarity, fruitData;
  if (roll < 50) { rarity = 'common'; fruitData = { name: 'Огонь', color: '#ff6600' }; }
  else if (roll < 75) { rarity = 'uncommon'; fruitData = { name: 'Лёд', color: '#00c8ff' }; }
  else if (roll < 93) { rarity = 'rare'; fruitData = null; }
  else if (roll < 98) { rarity = 'legendary'; fruitData = { name: 'Акула', color: '#1a4f8c' }; }
  else { rarity = 'mythic'; fruitData = { name: 'Контроль', color: '#5ac8ff' }; }

  if (fruitData) {
    giveFruitToSlot5(fruitData.name, fruitData.color);
    showToast(`${getRarityLabel(rarity)}: ${fruitData.name}!`);
  } else {
    showToast(`${getRarityLabel(rarity)} — скоро будет! (пока пусто)`);
  }

  rollCooldownUntil = Date.now() + ROLL_COOLDOWN_MS;
  saveNow();
}

  }

  }
  if (mx >= b.fruit.x && mx <= b.fruit.x + b.fruit.w && my >= b.fruit.y && my <= b.fruit.y + b.fruit.h) {

}

// ==================== ХОТБАР ====================
const HOTBAR_BOTTOM_MARGIN = 15;
const SLOT_SIZE = 55;
const SLOT_GAP = 8;
function getSlotRect(i) {
  const w = INVENTORY_SLOTS * SLOT_SIZE + (INVENTORY_SLOTS - 1) * SLOT_GAP;
  const sx = (canvas.width - w) / 2 - 40;
  const sy = canvas.height - SLOT_SIZE - HOTBAR_BOTTOM_MARGIN;
  return { x: sx + i * (SLOT_SIZE + SLOT_GAP), y: sy, w: SLOT_SIZE, h: SLOT_SIZE };
}
function getSlotAtPoint(mx, my) {
  for (let i = 0; i < INVENTORY_SLOTS; i++) {
    const r = getSlotRect(i);
    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return i;
  }
  return -1;
}
function openContextMenu() {
  const sx = player.x - camera.x + player.radius * 1.3, sy = player.y - camera.y;
  const bw = 140, bh = 38, gap = 6, pad = 8;
  const tw = bw + pad * 2;
  const th = menuButtons.length * bh + (menuButtons.length - 1) * gap + pad * 2;
  let mX = sx + 20, mY = sy - th / 2;
  if (mX + tw > canvas.width - 10) mX = sx - tw - 30;
  if (mY < 10) mY = 10;
  if (mY + th > canvas.height - 10) mY = canvas.height - th - 10;
  const btns = [];
  for (let i = 0; i < menuButtons.length; i++) {
    btns.push({ label: menuButtons[i].label, action: menuButtons[i].action, color: menuButtons[i].color,
      x: mX + pad, y: mY + pad + i * (bh + gap), w: bw, h: bh });
  }
  contextMenu = { x: mX, y: mY, w: tw, h: th, buttons: btns };
}
function executeMenuAction(action) {
  if (heldSlot === -1 || !inventory[heldSlot]) { contextMenu = null; return; }
  const item = inventory[heldSlot];
  if (item.type !== 'fruit') { contextMenu = null; return; }
  if (action === 'eat') {
    consumeFruit(item);
    inventory[heldSlot] = null; heldSlot = -1;
    player.fruitCount = Math.max(0, player.fruitCount - 1);
    updateFruitUi();
    saveNow();
  } else if (action === 'drop') {
    let lx = player.lookX, ly = player.lookY;
    if (lx === 0 && ly === 0) { lx = 1; ly = 0; }
    const l = Math.hypot(lx, ly) || 1; lx /= l; ly /= l;
    droppedFruits.push({
      x: player.x + lx * 70,
      y: player.y + ly * 70,
      radius: 20,
      color: item.color,
      name: item.name,
      bobPhase: Math.random() * 6,
      glow: item.name === 'Акула' || item.name === 'Контроль',
      warned: 0
    });
    inventory[heldSlot] = null; heldSlot = -1;
    player.fruitCount = Math.max(0, player.fruitCount - 1);
    updateFruitUi();
    showToast('Фрукт выброшен!');
    saveNow();
  } else if (action === 'save') {
    bag.push({ type: 'fruit', color: item.color, name: item.name });
    inventory[heldSlot] = null; heldSlot = -1;
    player.fruitCount = Math.max(0, player.fruitCount - 1);
    updateFruitUi();
    showToast('Фрукт в мешке!');
    saveNow();
  }
  contextMenu = null;
}

// ==================== МЕШОК ====================
const bagCols = 5, bagRows = 4, bagSlotSize = 80, bagGap = 12;
function handleBagClick(mx, my) {
  const c = getBagCloseRect();
  if (mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h) { bagOpen = false; return; }
  const g = getBagGridRect();
  for (let r = 0; r < bagRows; r++) {
    for (let col = 0; col < bagCols; col++) {
      const x = g.x + col * (bagSlotSize + bagGap);
      const y = g.y + r * (bagSlotSize + bagGap);
      if (mx >= x && mx <= x + bagSlotSize && my >= y && my <= y + bagSlotSize) {
        const i = r * bagCols + col;
        if (i < bag.length) { const item = bag[i]; bag.splice(i, 1); consumeFruit(item); saveNow(); }
        return;
      }
    }
  }
}
function getBagPanelRect() {
  const w = bagCols * bagSlotSize + (bagCols - 1) * bagGap + 60;
  const h = bagRows * bagSlotSize + (bagRows - 1) * bagGap + 120;
  return { x: (canvas.width - w) / 2, y: (canvas.height - h) / 2, w, h };
}
function getBagGridRect() { const p = getBagPanelRect(); return { x: p.x + 30, y: p.y + 90 }; }
function getBagCloseRect() { const p = getBagPanelRect(); return { x: p.x + p.w - 44, y: p.y + 15, w: 30, h: 30 }; }
function getInvButtonRect() { const s = 44, m = 15; return { x: canvas.width - s - m, y: canvas.height - s - m, w: s, h: s }; }
function isClickOnInvButton(mx, my) { const r = getInvButtonRect(); return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h; }

// ==================== КЛАВИАТУРА ====================
const keys = {};
window.addEventListener('keydown', (e) => {
  if (!currentUser) return;

  // === Админ-консоль: двойное нажатие N ===
  if (e.code === 'KeyN' || e.key.toLowerCase() === 'n' || e.key.toLowerCase() === 'т') {
    if (adminOpen) {
      if (e.key.length === 1) { adminInput += e.key; e.preventDefault(); }
      return;
    }
    const now = performance.now();
    if (now - lastNPressTime < ADMIN_N_DOUBLE_PRESS_MS) {
      lastNPressTime = 0;
      openAdminConsole();
      e.preventDefault();
      return;
    }
    lastNPressTime = now;
  }

  // === Ввод в админ-консоль ===
  if (adminOpen) {
    if (e.key === 'Escape') { closeAdminConsole(); e.preventDefault(); return; }
    if (e.key === 'Enter') { adminSubmit(); e.preventDefault(); return; }
    if (e.key === 'Backspace') { adminInput = adminInput.slice(0, -1); e.preventDefault(); return; }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) { adminInput += e.key; e.preventDefault(); return; }
    return;
  }

  const k = e.key.toLowerCase(), code = e.code;
  if (k === 'i' || k === 'ш' || code === 'KeyI') { bagOpen = !bagOpen; contextMenu = null; return; }
  if (code === 'Tab' || e.key === 'Tab') { e.preventDefault(); statsOpen = !statsOpen; questDialogOpen = false; rollDialogOpen = false; return; }
  if (code === 'KeyE' || k === 'e' || k === 'у') {
    if (isNearRollNpc() && !rollDialogOpen && !questDialogOpen && !statsOpen) { openRollDialog(); return; }
    if (isNearQuestNpc() && !questDialogOpen && !rollDialogOpen && !statsOpen) { openQuestDialog(); return; }
    return;
  }
  const held = getHeldPower();
  const tc = (letter) => {
    if (bagOpen || contextMenu || aimingAbility || statsOpen || questDialogOpen || rollDialogOpen) return;
    if (held) { const ab = held.abilities.find(a => a.key === letter); if (ab) startAbility(held.power.name, ab.id); }
    else showToast('Возьми силу в руки!');
  };
  if (code === 'KeyZ' || k === 'z' || k === 'я') { tc('Z'); return; }
  if (code === 'KeyX' || k === 'x' || k === 'ч') { tc('X'); return; }
  if (code === 'KeyC' || k === 'c' || k === 'с') { tc('C'); return; }
  if (code === 'KeyR' || k === 'r' || k === 'к') { tc('R'); return; }
  if (code === 'KeyV' || k === 'v' || k === 'м') { tc('V'); return; }
  if (e.key === 'Escape') {
    if (controlAim) { controlAim = null; return; }
    if (rollDialogOpen) { closeRollDialog(); return; }
    if (questDialogOpen) { closeQuestDialog(); return; }
    if (statsOpen) { closeStats(); return; }
    if (aimingAbility) { aimingAbility = null; return; }
    if (bagOpen) { bagOpen = false; return; }
    if (contextMenu) { contextMenu = null; return; }
  }
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (k >= '1' && k <= '5') {
    if (bagOpen || statsOpen || questDialogOpen || rollDialogOpen) return;
    const si = parseInt(k) - 1;
    const item = inventory[si];
    if (!item) return;
    if (item.type === 'power') {
      if (heldSlot === si && abilityGuide && abilityGuide.slotIndex === si) { heldSlot = -1; abilityGuide = null; }
      else { heldSlot = si; abilityGuide = { slotIndex: si, name: item.name, color: item.color, abilities: getAbilitiesFor(item.name) }; }
    } else {
      heldSlot = (heldSlot === si) ? -1 : si;
      if (heldSlot === -1 || !inventory[heldSlot] || inventory[heldSlot].type !== 'power') abilityGuide = null;
    }
    contextMenu = null;
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});

// ==================== ОБНОВЛЕНИЕ ====================
function update() {
  if (!currentUser) return;
  if (particles.length > 1500) particles.splice(0, particles.length - 1500);
  if (projectiles.length > 100) projectiles.splice(0, projectiles.length - 100);
  if (sharkBites.length > 50) sharkBites.splice(0, sharkBites.length - 50);
  if (whirlpools.length > 10) whirlpools.splice(0, whirlpools.length - 10);
  if (damageNumbers.length > 100) damageNumbers.splice(0, damageNumbers.length - 100);
  if (dashTrail.length > 200) dashTrail.splice(0, dashTrail.length - 200);
  if (iceZones.length > 15) iceZones.splice(0, iceZones.length - 15);
  if (iceFields.length > 15) iceFields.splice(0, iceFields.length - 15);
  if (meteors.length > 10) meteors.splice(0, meteors.length - 10);

  let g = 0;
  while (pendingXp.length > 0 && g < 50) { g++; addXp(pendingXp.shift()); }

  for (const rp of remotePlayers.values()) {
    const ddx = rp.targetX - rp.x;
    const ddy = rp.targetY - rp.y;
    rp.x += ddx * 0.25;
    rp.y += ddy * 0.25;
    if (rp.hitFlash > 0) rp.hitFlash--;
    if (rp.punchAnim > 0) rp.punchAnim = Math.max(0, rp.punchAnim - 0.08);
    // Удержание удалённых игроков в зонах
    for (const z of controlZones) {
      if (Math.hypot(rp.x - z.x, rp.y - z.y) < z.radius) {
        rp.targetX = Math.max(z.x - z.radius + 5, Math.min(z.x + z.radius - 5, rp.targetX));
        rp.targetY = Math.max(z.y - z.radius + 5, Math.min(z.y + z.radius - 5, rp.targetY));
        // Дополнительно ограничим радиусом
        const dx = rp.targetX - z.x, dy = rp.targetY - z.y;
        const d = Math.hypot(dx, dy);
        if (d > z.radius - 5) {
          rp.targetX = z.x + (dx / d) * (z.radius - 5);
          rp.targetY = z.y + (dy / d) * (z.radius - 5);
        }
      }
    }
  }

  const now = performance.now();
  const blocked = bagOpen || statsOpen || questDialogOpen || adminOpen || rollDialogOpen;
  player.isRunning = false;
  const spd = player.speedWalk;
  if (now < player.waterFormUntil) player.waterRage = 0.5 + Math.sin(now * 0.008) * 0.5;
  else player.waterRage = 0;

  if (now > player.seaDamageTimer && !blocked) { player.seaDamageTimer = now + 1000; applySeaDamage(); }

  if (!blocked && !aimingAbility && !controlAim) {
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup'] || keys['ц']) dy -= 1;
    if (keys['s'] || keys['arrowdown'] || keys['ы']) dy += 1;
    if (keys['a'] || keys['arrowleft'] || keys['ф']) dx -= 1;
    if (keys['d'] || keys['arrowright'] || keys['в']) dx += 1;
    if (dx && dy) { const l = Math.hypot(dx, dy); dx /= l; dy /= l; }
    tryMovePlayer(dx * spd, dy * spd);
    if (dx || dy) { player.lookX = dx; player.lookY = dy; }
    player.stamina = Math.min(getMaxStamina(), player.stamina + STAMINA_REGEN_PER_FRAME);
  } else {
    player.stamina = Math.min(getMaxStamina(), player.stamina + STAMINA_REGEN_PER_FRAME);
  }

  // Реген HP
  const mh = getMaxHp();
  const sinceDamage = now - player.lastDamageTime;
  if (sinceDamage >= HP_REGEN_DELAY_MS && player.hp < mh) {
    player.hp = Math.min(mh, player.hp + HP_REGEN_PER_FRAME);
  }
  if (player.hp > mh) player.hp = mh;

  // Подбор сброшенных фруктов
  if (!blocked && !aimingAbility && !controlAim) {
    for (let i = droppedFruits.length - 1; i >= 0; i--) {
      const f = droppedFruits[i];
      if (Math.hypot(player.x - f.x, player.y - f.y) < player.radius + f.radius) {
        let free = -1;
        for (let s = 0; s < INVENTORY_SLOTS; s++) {
          if (s === POWER_SLOT_INDEX) continue;
          if (inventory[s] === null) { free = s; break; }
        }
        if (free !== -1) {
          inventory[free] = { type: 'fruit', color: f.color, name: f.name };
          player.fruitCount++;
          updateFruitUi();
          showToast(`Подобран: ${f.name}`);
          droppedFruits.splice(i, 1);
          saveNow();
        } else {
          if (!f.warned || now - f.warned > 2000) { f.warned = now; showToast('Хотбар полон!'); }
        }
      }
    }
  }
  for (const f of droppedFruits) f.bobPhase = (f.bobPhase || 0) + 0.05;

  for (const k of Object.keys(player.cooldowns)) { if (player.cooldowns[k] > 0) player.cooldowns[k] -= 1/60; }
  if (player.punchCooldown > 0) player.punchCooldown -= 1/60;
  if (player.punchAnim > 0) player.punchAnim = Math.max(0, player.punchAnim - 0.08);

  // ============ ЗОНЫ КОНТРОЛЯ ============
  for (let i = controlZones.length - 1; i >= 0; i--) {
    const z = controlZones[i];
    z.life--;
    if (z.life <= 0) controlZones.splice(i, 1);
  }

  // ============ ЛАЗЕРЫ ============
  for (let i = controlLasers.length - 1; i >= 0; i--) {
    const l = controlLasers[i];
    l.life--;
    // Проверка попадания по пиратам/игрокам/нпс (один раз за луч)
    // Луч — от центра к краю по углу
    const ex = l.cx + Math.cos(l.angle) * l.len;
    const ey = l.cy + Math.sin(l.angle) * l.len;
    if (!l.hitPirates) l.hitPirates = new Set();
    // Пираты
    for (const pir of pirates) {
      if (pir.dead || l.hits.has(pir)) continue;
      if (pointNearSegment(pir.x, pir.y, l.cx, l.cy, ex, ey, 18 + pir.radius)) {
        damagePirate(pir, l.damage);
        l.hits.add(pir);
      }
    }
    // НПС
    if (!l.hits.has('npc') && pointNearSegment(npc.x, npc.y, l.cx, l.cy, ex, ey, 18 + npc.radius)) {
      damageNpc(l.damage);
      l.hits.add('npc');
    }
    // Другие игроки
    for (const rp of remotePlayers.values()) {
      if (l.hits.has(rp.u)) continue;
      if (pointNearSegment(rp.x, rp.y, l.cx, l.cy, ex, ey, 18 + player.radius)) {
        sendHit(rp.u, l.damage, 'ranged');
        l.hits.add(rp.u);
      }
    }
    if (l.life <= 0) controlLasers.splice(i, 1);
  }

  // ============ МЕТЕОРИТЫ КОНТРОЛЯ ============
  for (let i = controlMeteors.length - 1; i >= 0; i--) {
    const m = controlMeteors[i];
    m.fallProgress++;
    const t = m.fallProgress / m.duration;
    m.y = (m.targetY - 900) + 900 * Math.min(1, t);
    if (Math.random() < 0.6) particles.push({ x: m.x + (Math.random() - 0.5) * 30, y: m.y + (Math.random() - 0.5) * 30, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, life: 25, maxLife: 25, radius: 4 + Math.random() * 4, color: '#aaffff' });
    if (t >= 1 && !m.impactDone) {
      m.impactDone = true;
      // Прямое попадание (в радиусе m.radius от targetX/targetY): 35
      // Если игрок в зоне, но вне радиуса: 2
      for (const pir of pirates) {
        if (pir.dead) continue;
        const d = Math.hypot(pir.x - m.targetX, pir.y - m.targetY);
        if (d < m.radius) damagePirate(pir, m.damage);
        else if (Math.hypot(pir.x - m.zoneX, pir.y - m.zoneY) < m.zoneR) damagePirate(pir, 2);
      }
      {
        const d = Math.hypot(npc.x - m.targetX, npc.y - m.targetY);
        if (d < m.radius) damageNpc(m.damage);
        else if (Math.hypot(npc.x - m.zoneX, npc.y - m.zoneY) < m.zoneR) damageNpc(2);
      }
      for (const rp of remotePlayers.values()) {
        const d = Math.hypot(rp.x - m.targetX, rp.y - m.targetY);
        if (d < m.radius) sendHit(rp.u, m.damage, 'ranged');
        else if (Math.hypot(rp.x - m.zoneX, rp.y - m.zoneY) < m.zoneR) sendHit(rp.u, 2, 'ranged');
      }
      // свой урон тоже
      if (Math.hypot(player.x - m.targetX, player.y - m.targetY) < m.radius) damagePlayer(2);
      for (let k = 0; k < 40; k++) { const a = Math.random() * Math.PI * 2; const s = 3 + Math.random() * 8; particles.push({ x: m.targetX, y: m.targetY, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 40, maxLife: 70, radius: 4 + Math.random() * 6, color: '#ffaa66' }); }
      particles.push({ isShockwave: true, x: m.targetX, y: m.targetY, radius: 10, maxRadius: m.radius * 1.2, life: 30, maxLife: 30, color: '#ffaa66' });
    }
    if (m.impactDone && m.fallProgress > m.duration + 30) controlMeteors.splice(i, 1);
  }

  // ============ СИНИЕ ЛУЧИ ============
  for (let i = controlBeams.length - 1; i >= 0; i--) {
    const b = controlBeams[i];
    b.life--;
    // Активация на 2-й секунде (120 кадров жизни → активируется при life <= 60)
    if (!b.activated && b.life <= 60) {
      b.activated = true;
      // 70 урона тому, кто под лучом
      for (const pir of pirates) {
        if (pir.dead || b.hitDone) continue;
        if (Math.hypot(pir.x - b.x, pir.y - b.y) < b.radius) damagePirate(pir, b.damage);
      }
      for (const rp of remotePlayers.values()) {
        if (Math.hypot(rp.x - b.x, rp.y - b.y) < b.radius) sendHit(rp.u, b.damage, 'ranged');
      }
      if (Math.hypot(npc.x - b.x, npc.y - b.y) < b.radius) damageNpc(b.damage);
      b.hitDone = true;
      particles.push({ isShockwave: true, x: b.x, y: b.y, radius: 10, maxRadius: b.radius, life: 30, maxLife: 30, color: '#4fd4ff' });
    }
    if (b.life <= 0) controlBeams.splice(i, 1);
  }

  // СНАРЯДЫ
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.trail.length < 30) p.trail.push({ x: p.x, y: p.y, life: 15 });
    for (let j = p.trail.length - 1; j >= 0; j--) { p.trail[j].life--; if (p.trail[j].life <= 0) p.trail.splice(j, 1); }
    if (Math.random() < 0.7) {
      if (p.kind === 'fireball') particles.push({ x: p.x + (Math.random() - 0.5) * 10, y: p.y + (Math.random() - 0.5) * 10, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5 - 0.5, life: 20, maxLife: 20, radius: 3 + Math.random() * 4, color: Math.random() < 0.5 ? '#ffdd00' : '#ff6600' });
      else if (p.kind === 'ice_spear') particles.push({ x: p.x + (Math.random() - 0.5) * 12, y: p.y + (Math.random() - 0.5) * 12, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, life: 20, maxLife: 20, radius: 3 + Math.random() * 3, color: '#4fd4ff' });
    }
    let hit = false;
    if (Math.hypot(p.x - npc.x, p.y - npc.y) < p.radius + npc.radius && !p.pierced.has('npc')) {
      damageNpc(p.damage);
      if (p.kind === 'ice_spear') { npc.slowUntil = now + 1500; p.pierced.add('npc'); }
      else { hit = true; spawnImpactEffect(p.x, p.y); }
    }
    for (const pir of pirates) {
      if (pir.dead || p.pierced.has(pir)) continue;
      if (Math.hypot(p.x - pir.x, p.y - pir.y) < p.radius + pir.radius) {
        damagePirate(pir, p.damage);
        if (p.kind === 'ice_spear') { pir.slowUntil = now + 1500; p.pierced.add(pir); }
        else { hit = true; spawnImpactEffect(p.x, p.y); break; }
      }
    }
    if (!hit) {
      for (const rp of remotePlayers.values()) {
        if (p.pierced.has(rp.u)) continue;
        if (Math.hypot(p.x - rp.x, p.y - rp.y) < p.radius + player.radius) {
          sendHit(rp.u, p.damage, 'ranged');
          spawnImpactEffect(p.x, p.y);
          if (p.kind === 'ice_spear') { p.pierced.add(rp.u); }
          else { hit = true; }
          break;
        }
      }
    }
    if (hit || p.life <= 0) projectiles.splice(i, 1);
  }

  // АКУЛЫ
  for (let i = sharkBites.length - 1; i >= 0; i--) {
    const s = sharkBites[i];
    s.x += s.vx; s.y += s.vy; s.life--;
    if (s.trail.length < 40) s.trail.push({ x: s.x, y: s.y, life: 22 });
    for (let j = s.trail.length - 1; j >= 0; j--) { s.trail[j].life--; if (s.trail[j].life <= 0) s.trail.splice(j, 1); }
    if (Math.random() < 0.6) particles.push({ x: s.x + (Math.random() - 0.5) * 25, y: s.y + (Math.random() - 0.5) * 25, vx: (Math.random() - 0.5) * 2.5, vy: (Math.random() - 0.5) * 2.5 - 1, life: 25 + Math.random() * 15, maxLife: 40, radius: 3 + Math.random() * 4, color: Math.random() < 0.3 ? '#ffffff' : (Math.random() < 0.7 ? '#aaffff' : '#1a4f8c') });
    let hit = false;
    if (!s.pierced.has('npc') && Math.hypot(s.x - npc.x, s.y - npc.y) < s.radius + npc.radius) { damageNpc(s.damage); s.pierced.add('npc'); hit = true; spawnSharkImpact(s.x, s.y); }
    if (!hit) {
      for (const pir of pirates) {
        if (pir.dead || s.pierced.has(pir)) continue;
        if (Math.hypot(s.x - pir.x, s.y - pir.y) < s.radius + pir.radius) {
          damagePirate(pir, s.damage);
          s.pierced.add(pir);
          const dx = pir.x - player.x, dy = pir.y - player.y;
          const dl = Math.hypot(dx, dy) || 1;
          pir.x += (dx / dl) * 30; pir.y += (dy / dl) * 30;
          hit = true; spawnSharkImpact(s.x, s.y); break;
        }
      }
    }
    if (!hit) {
      for (const rp of remotePlayers.values()) {
        if (s.pierced.has(rp.u)) continue;
        if (Math.hypot(s.x - rp.x, s.y - rp.y) < s.radius + player.radius) {
          sendHit(rp.u, s.damage, 'ranged');
          s.pierced.add(rp.u);
          spawnSharkImpact(s.x, s.y);
          break;
        }
      }
    }
    if (hit || s.life <= 0) sharkBites.splice(i, 1);
  }

  // ВОДОВОРОТЫ
  for (let i = whirlpools.length - 1; i >= 0; i--) {
    const w = whirlpools[i];
    w.life--; w.rotation += 0.15;
    const t = Math.min(1, (w.maxLife - w.life) / 30);
    w.radius = w.maxRadius * t;
    for (const pir of pirates) { if (pir.dead || w.damagedOnce.has(pir)) continue; if (Math.hypot(pir.x - w.x, pir.y - w.y) < w.radius) { damagePirate(pir, w.damage); w.damagedOnce.add(pir); } }
    if (!w.damagedOnce.has('npc') && Math.hypot(npc.x - w.x, npc.y - w.y) < w.radius) { damageNpc(w.damage); w.damagedOnce.add('npc'); }
    for (const rp of remotePlayers.values()) {
      if (w.damagedOnce.has(rp.u)) continue;
      if (Math.hypot(rp.x - w.x, rp.y - w.y) < w.radius) {
        sendHit(rp.u, w.damage, 'ranged');
        w.damagedOnce.add(rp.u);
      }
    }
    const pullR = 350;
    for (const pir of pirates) {
      if (pir.dead) continue;
      const dx = pir.x - w.x, dy = pir.y - w.y, d = Math.hypot(dx, dy);
      if (d < pullR && d > 5) { const ps = d < w.radius ? 1.8 : (1.8 * (1 - (d - w.radius) / (pullR - w.radius)) * 1.2 + 0.3); pir.x -= (dx / d) * ps; pir.y -= (dy / d) * ps; }
    }

    if (w.tentacleTimer >= 45) {
      w.tentacleTimer = 0;
      let target = null, td = 999999;
      for (const pir of pirates) { if (pir.dead || w.grabbed.has(pir)) continue; const d = Math.hypot(pir.x - w.x, pir.y - w.y); if (d > w.radius && d < 320 && d < td) { target = pir; td = d; } }
      if (target) w.grabbed.set(target, { grabUntil: now + 2500, tentacleIdx: Math.floor(Math.random() * w.tentacleArms), spawnTime: now });
    }
    for (const [pir, info] of w.grabbed.entries()) {
      if (pir.dead || now > info.grabUntil) { w.grabbed.delete(pir); continue; }
      const dx = w.x - pir.x, dy = w.y - pir.y, d = Math.hypot(dx, dy);
      if (d > 5) { pir.x += (dx / d) * 4; pir.y += (dy / d) * 4; }

  }

  for (let i = whipTrails.length - 1; i >= 0; i--) { whipTrails[i].life--; if (whipTrails[i].life <= 0) whipTrails.splice(i, 1); }
  for (let i = iceZones.length - 1; i >= 0; i--) {
    const z = iceZones[i];
    z.life--;
    const t = Math.min(1, (z.maxLife - z.life) / 20);
    z.radius = z.maxRadius * t;
    if (!z.applied && t >= 1) {
      z.applied = true;
      for (const pir of pirates) { if (pir.dead) continue; if (Math.hypot(pir.x - z.x, pir.y - z.y) < z.maxRadius) { damagePirate(pir, z.damage); if (!pir.dead) pir.frozenUntil = performance.now() + z.freezeDuration; } }
      if (Math.hypot(npc.x - z.x, npc.y - z.y) < z.maxRadius) damageNpc(z.damage);
      for (const rp of remotePlayers.values()) {
        if (Math.hypot(rp.x - z.x, rp.y - z.y) < z.maxRadius) {
          sendHit(rp.u, z.damage, 'ranged');
        }
      }
    }
    if (z.life <= 0) iceZones.splice(i, 1);
  }
  for (let i = iceFields.length - 1; i >= 0; i--) {
    const f = iceFields[i]; f.life--;
    for (const pir of pirates) { if (pir.dead) continue; if (Math.hypot(pir.x - f.x, pir.y - f.y) < f.radius) { if (performance.now() < pir.frozenUntil || performance.now() < pir.stunUntil) continue; pir.slowUntil = performance.now() + 100; } }
    if (f.life <= 0) iceFields.splice(i, 1);
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.fallProgress++;
    const t = m.fallProgress / m.duration;
    m.y = (m.targetY - 900) + 900 * Math.min(1, t);
    if (Math.random() < 0.6) particles.push({ x: m.x + (Math.random() - 0.5) * 30, y: m.y + (Math.random() - 0.5) * 30, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, life: 25, maxLife: 25, radius: 4 + Math.random() * 4, color: '#aaffff' });
    if (t >= 1 && !m.impactDone) {
      m.impactDone = true;
      for (const pir of pirates) { if (pir.dead) continue; if (Math.hypot(pir.x - m.targetX, pir.y - m.targetY) < m.radius) { damagePirate(pir, m.damage); if (!pir.dead) pir.stunUntil = performance.now() + 2000; } }
      if (Math.hypot(npc.x - m.targetX, npc.y - m.targetY) < m.radius) damageNpc(m.damage);
      for (const rp of remotePlayers.values()) {
        if (Math.hypot(rp.x - m.targetX, rp.y - m.targetY) < m.radius) {
          sendHit(rp.u, m.damage, 'ranged');
        }
      }
      for (let k = 0; k < 40; k++) { const a = Math.random() * Math.PI * 2; const s = 3 + Math.random() * 8; particles.push({ x: m.targetX, y: m.targetY, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 40, maxLife: 70, radius: 4 + Math.random() * 6, color: '#aaffff' }); }
      particles.push({ isShockwave: true, x: m.targetX, y: m.targetY, radius: 10, maxRadius: 150, life: 30, maxLife: 30, color: '#aaffff' });

  }

  // ПИРАТЫ
  for (let i = pirates.length - 1; i >= 0; i--) {
    const pir = pirates[i];
    if (pir.dead) { if (pir.deathTimer > 0) pir.deathTimer--; if (now >= pir.respawnAt) { const idx = pir.spawnIdx; pirates.splice(i, 1); spawnPirate(idx); } continue; }

    if (pir.aggro && !pir.chasing && dist > PIRATE_LEASH_RADIUS) pir.aggro = false;

    // Удержание пирата в зоне
    const zone = isInControlZone(pir.x, pir.y);
    if (zone) {
      // пират внутри — не может выйти
      let nx = pir.x, ny = pir.y;
      if (pir.chasing && dist > 30) { nx += (dx / dist) * spd2; ny += (dy / dist) * spd2; }
      else if (pir.aggro && dist > 30 && dist < PIRATE_LEASH_RADIUS) { nx += (dx / dist) * spd2; ny += (dy / dist) * spd2; }
      else if (!pir.aggro) { const hx = pir.homeX - pir.x, hy = pir.homeY - pir.y, hd = Math.hypot(hx, hy); if (hd > 5) { nx += (hx / hd) * spd2; ny += (hy / hd) * spd2; } }
      // ограничение радиусом зоны

        const ang = Math.atan2(ny - zone.y, nx - zone.x);
        const r = zone.radius - pir.radius;
        nx = zone.x + Math.cos(ang) * r;
        ny = zone.y + Math.sin(ang) * r;
      }
      if (canBeAt(nx, pir.y, pir.radius)) pir.x = nx;
      if (canBeAt(pir.x, ny, pir.radius)) pir.y = ny;
    } else {
      if (pir.chasing) {
        if (dist > 30) { const nx = dx / dist, ny = dy / dist; const mx = nx * spd2, my = ny * spd2; if (canBeAt(pir.x + mx, pir.y, pir.radius)) pir.x += mx; if (canBeAt(pir.x, pir.y + my, pir.radius)) pir.y += my; }
      } else if (pir.aggro) {
        if (dist > 30 && dist < PIRATE_LEASH_RADIUS) { const nx = dx / dist, ny = dy / dist; const mx = nx * spd2, my = ny * spd2; if (canBeAt(pir.x + mx, pir.y, pir.radius)) pir.x += mx; if (canBeAt(pir.x, pir.y + my, pir.radius)) pir.y += my; }
        else if (dist >= PIRATE_LEASH_RADIUS) { const hx = pir.homeX - pir.x, hy = pir.homeY - pir.y, hd = Math.hypot(hx, hy); if (hd > 5) { const nx = hx / hd, ny = hy / hd; if (canBeAt(pir.x + nx * spd2, pir.y, pir.radius)) pir.x += nx * spd2; if (canBeAt(pir.x, pir.y + ny * spd2, pir.radius)) pir.y += ny * spd2; } else pir.aggro = false; }
      } else {
        const hx = pir.homeX - pir.x, hy = pir.homeY - pir.y, hd = Math.hypot(hx, hy);
        if (hd > 5) { const nx = hx / hd, ny = hy / hd; if (canBeAt(pir.x + nx * spd2, pir.y, pir.radius)) pir.x += nx * spd2; if (canBeAt(pir.x, pir.y + ny * spd2, pir.radius)) pir.y += ny * spd2; }
      }
    }
    if (dist < pir.radius + player.radius + 8 && now - pir.lastAttackTime > PIRATE_ATTACK_INTERVAL) { pir.lastAttackTime = now; damagePlayer(PIRATE_DAMAGE); }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i]; pt.life--;
    if (pt.isShockwave) { const t = 1 - pt.life / pt.maxLife; pt.radius = 10 + t * (pt.maxRadius - 10); }
    else { pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.95; pt.vy *= 0.95; }
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = dashTrail.length - 1; i >= 0; i--) { dashTrail[i].life--; if (dashTrail[i].life <= 0) dashTrail.splice(i, 1); }
  for (let i = damageNumbers.length - 1; i >= 0; i--) { const d = damageNumbers[i]; d.y += d.vy; d.vy *= 0.96; d.life--; if (d.life <= 0) damageNumbers.splice(i, 1); }
  if (performance.now() < npc.shakeUntil) { npc.shakeOffset.x = (Math.random() - 0.5) * 8; npc.shakeOffset.y = (Math.random() - 0.5) * 8; } else { npc.shakeOffset.x = 0; npc.shakeOffset.y = 0; }
  if (npc.hitFlash > 0) npc.hitFlash--;
  if (player.hitFlash > 0) player.hitFlash--;

  camera.x = player.x - canvas.width / 2;
  camera.y = player.y - canvas.height / 2;
  if (heldSlot !== -1 && !inventory[heldSlot]) { heldSlot = -1; abilityGuide = null; }
  if (heldSlot === -1 || !inventory[heldSlot] || inventory[heldSlot].type !== 'power') { if (abilityGuide) abilityGuide = null; }
  if (aimingAbility || isInWaterForm() || controlAim) canvas.classList.add('crosshair');
  else canvas.classList.remove('crosshair');
}

// Точка в пределах отрезка
function pointNearSegment(px, py, x1, y1, x2, y2, threshold) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1) < threshold;
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + dx * t, cy = y1 + dy * t;
  return Math.hypot(px - cx, py - cy) < threshold;
}

function spawnImpactEffect(x, y) {

function lightenColor(hex, amount) { const num = parseInt(hex.slice(1), 16); let r = (num >> 16) + Math.round(255 * amount); let g = ((num >> 8) & 0xff) + Math.round(255 * amount); let b = (num & 0xff) + Math.round(255 * amount); r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b); return `rgb(${r},${g},${b})`; }

function drawFruitShape(x, y, radius, color, phase = 0, bob = false, glow = false) {

    const x = pir.x - camera.x, y = pir.y - camera.y;
    let al = 1, sc = 1;
    if (pir.dead) { const t = pir.deathTimer / 40; al = t; sc = 0.5 + t * 0.5; }
    ctx.globalAlpha = al;
    ctx.beginPath(); ctx.ellipse(x, pir.y - camera.y + pir.radius * 0.9 * sc, pir.radius * 0.9 * sc, 6, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();

    let bc = isHit ? '#ffffff' : pir.color;
    if (isFrozen && !isHit) bc = '#66c8ff';

    const g = ctx.createRadialGradient(x - pir.radius * 0.35, y - pir.radius * 0.35, 2, x, y, pir.radius * sc); g.addColorStop(0, lightenColor(bc, 0.3)); g.addColorStop(1, bc);
    ctx.beginPath(); ctx.arc(x, y, pir.radius * sc, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = darkenColor(bc, 0.5); ctx.lineWidth = 3; ctx.stroke();

    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(x - eo, y - pir.radius * 0.05, er, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(x + eo, y - pir.radius * 0.05, er, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(x - eo + 1, y - pir.radius * 0.05, er * 0.55, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(x + eo + 1, y - pir.radius * 0.05, er * 0.55, 0, Math.PI * 2); ctx.fill();
    if (!pir.dead && (pir.aggro || pir.chasing)) {

      const sym = pir.chasing ? '‼' : '!';

function drawRemotePlayers() {
  for (const rp of remotePlayers.values()) {
    const x = rp.x - camera.x;
    const y = rp.y - camera.y;
    const r = player.radius;
    const inWater = rp.waterForm;

    if (inWater) {
      const t = performance.now() * 0.005;
      const ar = 65 + Math.sin(t * 3) * 6;
      const ag = ctx.createRadialGradient(x, y, r * 0.7, x, y, ar);
      ag.addColorStop(0, 'rgba(80,200,255,0.4)');
      ag.addColorStop(0.5, 'rgba(30,100,200,0.25)');
      ag.addColorStop(1, 'rgba(0,50,120,0)');
      ctx.beginPath(); ctx.arc(x, y, ar, 0, Math.PI * 2); ctx.fillStyle = ag; ctx.fill();
    }

    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.9, r * 0.9, 7, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();

    const isHit = rp.hitFlash > 0;
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, 3, x, y, r);
    if (isHit) { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ff6666'); }
    else if (inWater) { g.addColorStop(0, '#aaffff'); g.addColorStop(1, '#2288cc'); }
    else {
      try { g.addColorStop(0, lightenColor(rp.color, 0.35)); } catch (e) { g.addColorStop(0, '#ffddaa'); }
      try { g.addColorStop(1, rp.color); } catch (e) { g.addColorStop(1, '#ffb300'); }
    }
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    let strokeCol = '#b37700';
    try { strokeCol = darkenColor(rp.color, 0.3); } catch (e) {}
    if (inWater) strokeCol = '#005588';
    ctx.strokeStyle = strokeCol; ctx.lineWidth = 3; ctx.stroke();

    let lx = rp.lx, ly = rp.ly;
    if (lx === 0 && ly === 0) { lx = 0.3; ly = 0.5; }
    const ll = Math.hypot(lx, ly) || 1; lx /= ll; ly /= ll;
    const eo = r * 0.35, eoy = -r * 0.15, er = r * 0.28, pr = er * 0.55, ps = er * 0.35;
    const eLx = x - eo, eLy = y + eoy, eRx = x + eo, eRy = y + eoy;
    ctx.beginPath(); ctx.arc(eLx, eLy, er, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill(); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(eRx, eRy, er, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill(); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(eLx + lx * ps, eLy + ly * ps, pr, 0, Math.PI * 2); ctx.fillStyle = inWater ? '#003366' : '#1a1a1a'; ctx.fill();
    ctx.beginPath(); ctx.arc(eRx + lx * ps, eRy + ly * ps, pr, 0, Math.PI * 2); ctx.fillStyle = inWater ? '#003366' : '#1a1a1a'; ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y + r * 0.25, r * 0.4, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.strokeStyle = inWater ? '#003366' : '#5a3a00';
    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke();

    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
    ctx.strokeText(rp.u, x, y - r - 12);
    ctx.fillStyle = rp.color || '#ffd700';
    try { ctx.fillStyle = rp.color; } catch (e) {}
    ctx.fillText(rp.u, x, y - r - 12);

    if (rp.hp < rp.mhp) {
      const bw = 52, bh = 6;
      const bx = x - bw / 2;
      const by = y - r - 32;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      roundRect(bx - 2, by - 2, bw + 4, bh + 4, 3); ctx.fill();
      ctx.fillStyle = '#3a0000';
      roundRect(bx, by, bw, bh, 2); ctx.fill();
      const hr = Math.max(0, rp.hp) / rp.mhp;
      if (hr > 0) {
        ctx.fillStyle = '#ff3b3b';
        roundRect(bx, by, bw * hr, bh, 2); ctx.fill();
      }
    }
  }
}

function drawProjectiles() {

      const g = ctx.createRadialGradient(tr.x - camera.x, tr.y - camera.y, 0, tr.x - camera.x, tr.y - camera.y, r);
      if (p.kind === 'fireball') { g.addColorStop(0, `rgba(255,220,100,${a * 0.8})`); g.addColorStop(0.6, `rgba(255,100,0,${a * 0.5})`); g.addColorStop(1, 'rgba(255,50,0,0)'); }

      ctx.beginPath(); ctx.arc(tr.x - camera.x, tr.y - camera.y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    }
    if (p.kind === 'fireball') {

      g.addColorStop(0, 'rgba(200,245,255,0.9)'); g.addColorStop(0.6, 'rgba(80,180,255,0.5)'); g.addColorStop(1, 'rgba(40,100,200,0)');
      ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.moveTo(len, 0); ctx.lineTo(len * 0.3, -wid); ctx.lineTo(-len * 0.7, -wid * 0.4); ctx.lineTo(-len * 0.7, wid * 0.4); ctx.lineTo(len * 0.3, wid); ctx.closePath();

function drawParticles() {
  for (const pt of particles) {
