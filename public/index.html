    if (pt.isShockwave) {
      ctx.beginPath(); ctx.arc(pt.x - camera.x, pt.y - camera.y, pt.radius, 0, Math.PI * 2);
      let col = pt.color;
      if (col.startsWith('#')) { const num = parseInt(col.slice(1), 16); col = `rgba(${num >> 16},${(num >> 8) & 0xff},${num & 0xff},${a})`; }
      ctx.strokeStyle = col; ctx.lineWidth = 4 * a; ctx.stroke();
    } else {
      const x = pt.x - camera.x, y = pt.y - camera.y;
      const g = ctx.createRadialGradient(x, y, 0, x, y, pt.radius);
      let rgb = pt.color;
      if (pt.color.startsWith('#') && pt.color.length === 7) { const num = parseInt(pt.color.slice(1), 16); rgb = `rgb(${num >> 16},${(num >> 8) & 0xff},${num & 0xff})`; }
      g.addColorStop(0, rgb.replace('rgb', 'rgba').replace(')', `, ${a})`));
      g.addColorStop(1, rgb.replace('rgb', 'rgba').replace(')', `, 0)`));
      ctx.beginPath(); ctx.arc(x, y, pt.radius, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    }
  }
}

function drawSharkBites() {
  for (const s of sharkBites) {
    const x = s.x - camera.x, y = s.y - camera.y;
    for (const tr of s.trail) {
      const a = tr.life / 22, r = s.radius * 0.7 * (tr.life / 22);
      const g = ctx.createRadialGradient(tr.x - camera.x, tr.y - camera.y, 0, tr.x - camera.x, tr.y - camera.y, r);
      g.addColorStop(0, `rgba(200,240,255,${a * 0.7})`); g.addColorStop(0.5, `rgba(80,180,255,${a * 0.5})`); g.addColorStop(1, 'rgba(20,60,140,0)');
      ctx.beginPath(); ctx.arc(tr.x - camera.x, tr.y - camera.y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    }
    ctx.save(); ctx.translate(x, y); ctx.rotate(s.angle);
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, 40);
    gr.addColorStop(0, 'rgba(200,240,255,0.7)'); gr.addColorStop(0.6, 'rgba(80,180,255,0.4)'); gr.addColorStop(1, 'rgba(20,60,140,0)');
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fillStyle = gr; ctx.fill();
    const len = s.radius * 1.6, wid = s.radius * 0.7;
    ctx.beginPath(); ctx.moveTo(len, 0); ctx.bezierCurveTo(len * 0.5, -wid, -len * 0.4, -wid * 0.85, -len, -wid * 0.3); ctx.lineTo(-len * 1.1, 0); ctx.lineTo(-len, wid * 0.3); ctx.bezierCurveTo(-len * 0.4, wid * 0.85, len * 0.5, wid, len, 0); ctx.closePath();
    const bg = ctx.createLinearGradient(0, -wid, 0, wid); bg.addColorStop(0, '#4a6e9c'); bg.addColorStop(0.5, '#1a3a5c'); bg.addColorStop(1, '#0a1a3a');
    ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = '#0a1a2a'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -wid * 0.6); ctx.lineTo(-len * 0.3, -wid * 1.8); ctx.lineTo(-len * 0.55, -wid * 0.55); ctx.closePath(); ctx.fillStyle = '#1a3a5c'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(-len * 1.4, -wid * 0.9); ctx.lineTo(-len * 1.15, 0); ctx.lineTo(-len * 1.4, wid * 0.9); ctx.closePath(); ctx.fillStyle = '#0a1a3a'; ctx.fill();
    ctx.beginPath(); ctx.arc(len * 0.55, -wid * 0.15, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();
    ctx.beginPath(); ctx.arc(len * 0.55, -wid * 0.15, 1.5, 0, Math.PI * 2); ctx.fillStyle = '#ff3333'; ctx.fill();
    ctx.restore();
  }
}

function drawWhirlpools() {
  for (const w of whirlpools) {
    const x = w.x - camera.x, y = w.y - camera.y;
    const a = Math.min(1, w.life / 60);
    const t = performance.now() * 0.002;
    const g = ctx.createRadialGradient(x, y, 0, x, y, w.radius);
    g.addColorStop(0, `rgba(20,60,140,${a * 0.7})`); g.addColorStop(0.5, `rgba(60,130,220,${a * 0.5})`); g.addColorStop(1, `rgba(150,220,255,${a * 0.2})`);
    ctx.beginPath(); ctx.arc(x, y, w.radius, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    for (let arm = 0; arm < 5; arm++) {
      const aa = t + arm * (Math.PI * 2 / 5);
      ctx.beginPath();
      for (let i = 0; i < 30; i++) { const r = i / 30; const ang = aa + r * Math.PI * 2; const rr = r * w.radius; const px = x + Math.cos(ang) * rr, py = y + Math.sin(ang) * rr; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
      ctx.strokeStyle = `rgba(200,240,255,${a * 0.6})`; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.beginPath(); ctx.setLineDash([10, 8]); ctx.arc(x, y, w.radius, 0, Math.PI * 2); ctx.strokeStyle = `rgba(200,240,255,${a * 0.8})`; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
  }
}

function drawWhirlpoolTentacles() {
  for (const w of whirlpools) {
    if (!w.grabbed) continue;
    const now = performance.now();
    for (const [pir, info] of w.grabbed.entries()) {
      if (pir.dead || now > info.grabUntil) continue;
      const sx = w.x - camera.x, sy = w.y - camera.y, ex = pir.x - camera.x, ey = pir.y - camera.y;
      const seg = 14, t = now * 0.005 + info.tentacleIdx;
      ctx.beginPath(); ctx.moveTo(sx, sy);
      for (let i = 1; i <= seg; i++) {
        const r = i / seg, pp = r * Math.PI * 4 + t * 2, pa = 12 * Math.sin(r * Math.PI);
        const dx = ex - sx, dy = ey - sy, l = Math.hypot(dx, dy);
        const nx = dx / l, ny = dy / l, px = -ny, py = nx;
        const wig = Math.sin(pp) * pa;
        ctx.lineTo(sx + dx * r + px * wig, sy + dy * r + py * wig);
      }
      const g = ctx.createLinearGradient(sx, sy, ex, ey);
      g.addColorStop(0, 'rgba(20,60,140,0.95)'); g.addColorStop(0.5, 'rgba(80,180,255,0.9)'); g.addColorStop(1, 'rgba(200,240,255,0.95)');
      ctx.strokeStyle = g; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.beginPath(); ctx.arc(ex, ey, 14 + Math.sin(now * 0.01) * 2, 0, Math.PI * 2);
      const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, 16);
      eg.addColorStop(0, 'rgba(255,255,255,0.9)'); eg.addColorStop(0.5, 'rgba(180,240,255,0.6)'); eg.addColorStop(1, 'rgba(80,180,255,0)');
      ctx.fillStyle = eg; ctx.fill();
    }
  }
}

function drawWhipTrails() {
  for (const w of whipTrails) {
    const a = w.life / w.maxLife;
    const bx = w.x - camera.x, by = w.y - camera.y;
    const ps = w.phase === 0 ? 1 : -1;
    const ar = 70 * (1 - a * 0.4);
    const sa = w.angle - 0.7 * ps, ea = w.angle + 0.7 * ps;
    ctx.beginPath();
    for (let i = 0; i <= 20; i++) { const t = i / 20; const an = sa + (ea - sa) * t; const r = ar * (0.8 + Math.sin(t * Math.PI) * 0.3); const px = bx + Math.cos(an) * r, py = by + Math.sin(an) * r; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
    ctx.strokeStyle = `rgba(255,255,255,${a * 0.9})`; ctx.lineWidth = 8 * a; ctx.lineCap = 'round'; ctx.stroke();
  }
}

function drawControlZones() {
  for (const z of controlZones) {
    const x = z.x - camera.x, y = z.y - camera.y;
    const a = Math.min(1, z.life / 60);
    const t = performance.now() * 0.002;

    // Полупрозрачный купол
    const g = ctx.createRadialGradient(x, y, 0, x, y, z.radius);
    g.addColorStop(0, `rgba(90,200,255,${0.10 * a})`);
    g.addColorStop(0.7, `rgba(90,200,255,${0.15 * a})`);
    g.addColorStop(1, `rgba(90,200,255,${0.35 * a})`);
    ctx.beginPath(); ctx.arc(x, y, z.radius, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();

    // Кольцо по краю
    ctx.beginPath(); ctx.arc(x, y, z.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(140,220,255,${0.85 * a})`;
    ctx.lineWidth = 4; ctx.stroke();

    // Пульсация
    ctx.beginPath(); ctx.arc(x, y, z.radius * (0.98 + Math.sin(t * 3) * 0.01), 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(180,240,255,${0.5 * a})`;
    ctx.lineWidth = 2; ctx.stroke();

    // Надпись владельца
    ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
    const label = '🌀 ' + z.owner;
    ctx.strokeText(label, x, y - z.radius - 16);
    ctx.fillStyle = '#aaddff'; ctx.fillText(label, x, y - z.radius - 16);
  }
}

function drawControlLasers() {
  for (const l of controlLasers) {
    const a = l.life / l.maxLife;
    const cx = l.cx - camera.x, cy = l.cy - camera.y;
    const ex = cx + Math.cos(l.angle) * l.len;
    const ey = cy + Math.sin(l.angle) * l.len;
    // Луч
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey);
    ctx.strokeStyle = `rgba(120,220,255,${a})`;
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.stroke();
    // Яркое ядро
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey);
    ctx.strokeStyle = `rgba(255,255,255,${a})`;
    ctx.lineWidth = 4;
    ctx.stroke();
  }
}

function drawControlMeteors() {
  for (const m of controlMeteors) {
    const x = m.x - camera.x, y = m.y - camera.y;
    const tx = m.targetX - camera.x, ty = m.targetY - camera.y;
    // Круг цели
    ctx.beginPath(); ctx.arc(tx, ty, m.radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,140,80,0.85)'; ctx.lineWidth = 3;
    ctx.setLineDash([12, 8]); ctx.stroke(); ctx.setLineDash([]);
    // Метеорит
    if (!m.impactDone) {
      const gr = ctx.createRadialGradient(x, y, 0, x, y, 90);
      gr.addColorStop(0, 'rgba(255,255,255,1)');
      gr.addColorStop(0.3, 'rgba(255,200,120,1)');
      gr.addColorStop(0.7, 'rgba(255,120,40,0.9)');
      gr.addColorStop(1, 'rgba(120,30,0,0)');
      ctx.beginPath(); ctx.arc(x, y, 90, 0, Math.PI * 2); ctx.fillStyle = gr; ctx.fill();
    }

}

function drawControlBeams() {
  for (const b of controlBeams) {
    const x = b.x - camera.x, y = b.y - camera.y;
    const a = b.life / b.maxLife;
    // Прицельная зона
    ctx.beginPath(); ctx.arc(x, y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = b.activated ? `rgba(80,180,255,${0.25 * a})` : `rgba(80,180,255,${0.10 * a})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(140,220,255,${0.85 * a})`; ctx.lineWidth = 4; ctx.stroke();
    // Зарядка
    if (!b.activated) {
      const t = performance.now() * 0.005;
      ctx.beginPath(); ctx.arc(x, y, b.radius * (0.3 + 0.7 * (1 - a)), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${0.6 * a})`; ctx.lineWidth = 3; ctx.stroke();
      // Молнии/искры по центру
      for (let i = 0; i < 6; i++) {
        const ang = t + i * (Math.PI * 2 / 6);
        const r = 20 + Math.sin(t * 4 + i) * 10;
        ctx.beginPath();
        ctx.arc(x + Math.cos(ang) * r, y + Math.sin(ang) * r, 4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,240,255,${a})`; ctx.fill();
      }
    } else {
      // Активированный луч — яркая вспышка
      const gr = ctx.createRadialGradient(x, y, 0, x, y, b.radius);
      gr.addColorStop(0, `rgba(255,255,255,${a})`);
      gr.addColorStop(0.4, `rgba(120,220,255,${a})`);
      gr.addColorStop(1, `rgba(30,100,200,0)`);
      ctx.beginPath(); ctx.arc(x, y, b.radius, 0, Math.PI * 2); ctx.fillStyle = gr; ctx.fill();
      // Молния вверх
      ctx.beginPath();
      ctx.moveTo(x, y - b.radius * 1.4);
      ctx.lineTo(x + 20, y - b.radius * 0.7);
      ctx.lineTo(x - 15, y - b.radius * 0.5);
      ctx.lineTo(x, y);
      ctx.strokeStyle = `rgba(255,255,255,${a})`;
      ctx.lineWidth = 6; ctx.stroke();
    }
  }
}

function drawDamageNumbers() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const d of damageNumbers) {
    const a = Math.min(1, d.life / 30);
    const sc = 1 + (1 - d.life / d.maxLife) * 0.5;
    ctx.font = `bold ${Math.floor(24 * sc)}px Arial`;
    ctx.strokeStyle = `rgba(0,0,0,${a})`; ctx.lineWidth = 4;
    ctx.strokeText(d.text, d.x - camera.x, d.y - camera.y);
    if (d.color.startsWith('#')) { const num = parseInt(d.color.slice(1), 16); ctx.fillStyle = `rgba(${num >> 16},${(num >> 8) & 0xff},${num & 0xff},${a})`; }
    else ctx.fillStyle = d.color;
    ctx.fillText(d.text, d.x - camera.x, d.y - camera.y);
  }
}

function drawPlayer() {
  const x = player.x - camera.x, y = player.y - camera.y;
  const inWater = isInWaterForm();
  const t = performance.now() * 0.005;
  if (!isOnIsland(player.x, player.y) && !inWater) {
    for (let i = 0; i < 8; i++) { const a = t * 2 + i * (Math.PI / 4); const r = player.radius + 10 + Math.sin(t * 3 + i) * 4; const dx = x + Math.cos(a) * r, dy = y + Math.sin(a) * r; ctx.beginPath(); ctx.arc(dx, dy, 2 + Math.sin(t * 4 + i), 0, Math.PI * 2); ctx.fillStyle = 'rgba(150,220,255,0.7)'; ctx.fill(); }
    const g = ctx.createRadialGradient(x, y + 15, 0, x, y + 15, 40); g.addColorStop(0, 'rgba(80,180,255,0.5)'); g.addColorStop(1, 'rgba(80,180,255,0)');
    ctx.beginPath(); ctx.ellipse(x, y + 15, 40, 15, 0, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  }
  if (inWater) {
    const ar = 65 + Math.sin(t * 3) * 6;
    const ag = ctx.createRadialGradient(x, y, player.radius * 0.7, x, y, ar);
    ag.addColorStop(0, 'rgba(80,200,255,0.4)'); ag.addColorStop(0.5, 'rgba(30,100,200,0.25)'); ag.addColorStop(1, 'rgba(0,50,120,0)');
    ctx.beginPath(); ctx.arc(x, y, ar, 0, Math.PI * 2); ctx.fillStyle = ag; ctx.fill();
    const cy = y - player.radius - 15;
    for (let i = 0; i < 5; i++) { const cx = x + (i - 2) * 8; const ccy = cy + Math.sin(t * 4 + i) * 3; const h = 8 + Math.sin(t * 5 + i) * 4; const cg = ctx.createLinearGradient(cx, ccy - h, cx, ccy + 4); cg.addColorStop(0, 'rgba(200,240,255,0.9)'); cg.addColorStop(1, 'rgba(80,180,255,0)'); ctx.beginPath(); ctx.moveTo(cx, ccy - h); ctx.lineTo(cx - 3, ccy + 4); ctx.lineTo(cx + 3, ccy + 4); ctx.closePath(); ctx.fillStyle = cg; ctx.fill(); }
    for (let i = 0; i < 8; i++) { const a = t * 1.5 + i * (Math.PI / 4); const r = player.radius + 20 + Math.sin(t * 2 + i) * 4; const dx = x + Math.cos(a) * r, dy = y + Math.sin(a) * r; ctx.beginPath(); ctx.arc(dx, dy, 3 + Math.sin(t * 3 + i), 0, Math.PI * 2); const dg = ctx.createRadialGradient(dx, dy, 0, dx, dy, 4); dg.addColorStop(0, 'rgba(255,255,255,0.9)'); dg.addColorStop(1, 'rgba(80,180,255,0)'); ctx.fillStyle = dg; ctx.fill(); }
  }
  ctx.beginPath(); ctx.ellipse(x, y + player.radius * 0.9, player.radius * 0.9, 7, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
  const isHit = player.hitFlash > 0;
  const g = ctx.createRadialGradient(x - player.radius * 0.35, y - player.radius * 0.35, 3, x, y, player.radius);
  if (isHit) { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ff6666'); }
  else if (inWater) { g.addColorStop(0, '#aaffff'); g.addColorStop(1, '#2288cc'); }
  else { g.addColorStop(0, '#ffe066'); g.addColorStop(1, '#ffb300'); }
  ctx.beginPath(); ctx.arc(x, y, player.radius, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = inWater ? '#005588' : '#b37700'; ctx.lineWidth = 3; ctx.stroke();
  if (player.punchAnim > 0.05) {
    const px = x + player.punchDir.x * (player.radius + 15 + player.punchAnim * 20);
    const py = y + player.punchDir.y * (player.radius + 15 + player.punchAnim * 20);
    ctx.beginPath(); ctx.arc(px, py, 14 + player.punchAnim * 6, 0, Math.PI * 2);
    const pg = ctx.createRadialGradient(px - 3, py - 3, 2, px, py, 14); pg.addColorStop(0, '#ffe066'); pg.addColorStop(1, '#ffb300');
    ctx.fillStyle = pg; ctx.fill(); ctx.strokeStyle = '#b37700'; ctx.lineWidth = 2; ctx.stroke();
  }
  let lx = player.lookX, ly = player.lookY;
  if (lx === 0 && ly === 0) { lx = 0.3; ly = 0.5; }
  const ll = Math.hypot(lx, ly) || 1; lx /= ll; ly /= ll;
  const eo = player.radius * 0.35, eoy = -player.radius * 0.15, er = player.radius * 0.28, pr = er * 0.55, ps = er * 0.35;
  const eLx = x - eo, eLy = y + eoy, eRx = x + eo, eRy = y + eoy;
  ctx.beginPath(); ctx.arc(eLx, eLy, er, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill(); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(eRx, eRy, er, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill(); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(eLx + lx * ps, eLy + ly * ps, pr, 0, Math.PI * 2); ctx.fillStyle = inWater ? '#003366' : '#1a1a1a'; ctx.fill();
  ctx.beginPath(); ctx.arc(eRx + lx * ps, eRy + ly * ps, pr, 0, Math.PI * 2); ctx.fillStyle = inWater ? '#003366' : '#1a1a1a'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y + player.radius * 0.25, player.radius * 0.4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.strokeStyle = inWater ? '#003366' : '#5a3a00'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke();
  if (currentUser) {
    ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
    ctx.strokeText(currentUser.username, x, y - player.radius - 12);
    ctx.fillStyle = '#ffd700'; ctx.fillText(currentUser.username, x, y - player.radius - 12);
  }
  if (inWater) {
    const rem = (player.waterFormUntil - performance.now()) / TRANSFORM_DURATION;
    ctx.beginPath(); ctx.arc(x, y, player.radius + 35, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rem);
    ctx.strokeStyle = 'rgba(150,230,255,0.85)'; ctx.lineWidth = 3; ctx.stroke();
  }
}

function drawHeldItem() {
  if (heldSlot === -1) return;
  const item = inventory[heldSlot];
  if (!item || item.type === 'fists' || isInWaterForm()) return;
  const x = player.x - camera.x + player.radius * 1.1, y = player.y - camera.y + player.radius * 0.5;
  if (item.type === 'fruit') {
    ctx.beginPath(); ctx.strokeStyle = '#b37700'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.moveTo(player.x - camera.x + player.radius * 0.7, player.y - camera.y + player.radius * 0.3);
    ctx.lineTo(x - 5, y - 5); ctx.stroke();
    drawFruitShape(x, y, 14, item.color, performance.now() * 0.002, false, item.name === 'Акула' || item.name === 'Контроль');
  } else if (item.type === 'power') {
    const t = performance.now() * 0.005;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 16 + Math.sin(t) * 2);
    if (item.name === 'Огонь') { g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(255,240,100,1)'); g.addColorStop(0.7, 'rgba(255,120,0,0.7)'); g.addColorStop(1, 'rgba(255,40,0,0)'); }
    else if (item.name === 'Лёд') { g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(180,240,255,1)'); g.addColorStop(0.7, 'rgba(80,180,255,0.8)'); g.addColorStop(1, 'rgba(40,100,200,0)'); }
    else if (item.name === 'Контроль') { g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(180,240,255,1)'); g.addColorStop(0.7, 'rgba(90,200,255,0.85)'); g.addColorStop(1, 'rgba(30,100,200,0)'); }
    else { g.addColorStop(0, 'rgba(200,240,255,1)'); g.addColorStop(0.5, 'rgba(80,180,255,0.7)'); g.addColorStop(1, 'rgba(20,60,140,0)'); }
    ctx.beginPath(); ctx.arc(x, y, 16 + Math.sin(t) * 2, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  }
}

function drawPowerIcon(cx, cy, radius, name) {
  if (name === 'Огонь') {
    const bg = ctx.createRadialGradient(cx, cy, 1, cx, cy, radius * 1.2); bg.addColorStop(0, '#2a1a0a'); bg.addColorStop(1, '#0a0500');
    ctx.beginPath(); ctx.arc(cx, cy, radius * 1.1, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = '#ff6600'; ctx.lineWidth = 2; ctx.stroke();
    const fh = radius * 1.5, fw = radius * 1.0;
    ctx.beginPath(); ctx.moveTo(cx, cy - fh * 0.55); ctx.bezierCurveTo(cx + fw * 0.9, cy - fh * 0.1, cx + fw * 0.7, cy + fh * 0.5, cx, cy + fh * 0.5); ctx.bezierCurveTo(cx - fw * 0.7, cy + fh * 0.5, cx - fw * 0.9, cy - fh * 0.1, cx, cy - fh * 0.55);
    const fg = ctx.createRadialGradient(cx, cy + fh * 0.15, 1, cx, cy, fh * 0.8); fg.addColorStop(0, '#ffff66'); fg.addColorStop(0.4, '#ff9900'); fg.addColorStop(1, '#ff2200'); ctx.fillStyle = fg; ctx.fill();
  } else if (name === 'Лёд') {
    const bg = ctx.createRadialGradient(cx, cy, 1, cx, cy, radius * 1.2); bg.addColorStop(0, '#0a1a2a'); bg.addColorStop(1, '#000510');
    ctx.beginPath(); ctx.arc(cx, cy, radius * 1.1, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = '#00c8ff'; ctx.lineWidth = 2; ctx.stroke();

function drawFistsIcon(cx, cy, radius) {

function drawAbilityGuide() {

    if (cd > 0) { const r = cd / ab.cooldown; ctx.beginPath(); ctx.moveTo(ix, iy); ctx.arc(ix, iy, ir, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * r); ctx.closePath(); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill(); ctx.fillStyle = '#ffcc66'; ctx.font = 'bold 11px Arial'; ctx.fillText(cd.toFixed(1), ix, iy); }
    ctx.fillStyle = unlocked ? '#ffffff' : '#888'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(ab.name, ix + ir + 8, abY + 10);

    ctx.fillText(ab.description, ix + ir + 8, abY + 28);
    ctx.fillStyle = unlocked ? '#66ff66' : '#ff6666'; ctx.font = 'bold 10px Arial';
    ctx.fillText(unlocked ? `✓ ${ab.requiredMastery} mastery` : `🔒 нужно ${ab.requiredMastery}`, ix + ir + 8, abY + rh - 14);

      const wmRatio = Math.min(1, waterMeter / WATER_METER_MAX);

  const p = b.panel;
  ctx.fillStyle = 'rgba(20,15,25,0.95)'; ctx.strokeStyle = 'rgba(255,215,0,0.8)'; ctx.lineWidth = 3;
  roundRect(p.x, p.y, p.w, p.h, 16); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.strokeStyle = 'black'; ctx.lineWidth = 4;
  ctx.strokeText('⚓ Капитан Барнс', p.x + 30, p.y + 25); ctx.fillText('⚓ Капитан Барнс', p.x + 30, p.y + 25);
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'italic 16px Arial'; ctx.strokeStyle = 'transparent';
  const dt = quest.active ? `Квест активен! Осталось ${quest.active.target - quest.active.current} пиратов.` : 'Йо-хо-хо! Убей пиратов — дам 200 монет!';
  ctx.fillText(dt, p.x + 30, p.y + 75);
  ctx.fillStyle = 'rgba(255,215,0,0.85)'; ctx.font = 'bold 15px Arial';
  ctx.fillText(`💰 Награда: 200 монет + 100 XP`, p.x + 30, p.y + 105);
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '13px Arial';
  ctx.fillText(`📈 Ещё +5 монет за каждого пирата`, p.x + 30, p.y + 130);
  const c = b.close;
  ctx.fillStyle = 'rgba(255,80,80,0.85)'; roundRect(c.x, c.y, c.w, c.h, 6); ctx.fill();
  ctx.fillStyle = 'white'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('✕', c.x + c.w / 2, c.y + c.h / 2);
  const tq = b.takeQuest;
  ctx.fillStyle = quest.active ? 'rgba(80,80,80,0.6)' : 'rgba(76,175,80,0.9)';
  roundRect(tq.x, tq.y, tq.w, tq.h, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'white'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tt = quest.active ? '⏳ Квест уже активен' : '📜 Взять квест на пиратов';
  ctx.fillText(tt, tq.x + tq.w / 2, tq.y + tq.h / 2);
}

function drawRollDialog() {
  if (!rollDialogOpen) return;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const b = getRollDialogButtons();
  const p = b.panel;
  ctx.fillStyle = 'rgba(25,15,35,0.96)'; ctx.strokeStyle = 'rgba(200,160,255,0.85)'; ctx.lineWidth = 3;
  roundRect(p.x, p.y, p.w, p.h, 16); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#c4a4ff'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.strokeStyle = 'black'; ctx.lineWidth = 4;
  ctx.strokeText('🎰 Nexvertix', p.x + 30, p.y + 22); ctx.fillText('🎰 Nexvertix', p.x + 30, p.y + 22);

  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = 'italic 15px Arial'; ctx.strokeStyle = 'transparent';
  ctx.fillText('Крути и получай случайные фрукты!', p.x + 30, p.y + 62);

  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 19px Arial'; ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
  const mTxt = `💰 Твои монеты: ${player.money}`;
  ctx.strokeText(mTxt, p.x + 30, p.y + 100); ctx.fillText(mTxt, p.x + 30, p.y + 100);

  const cost = getRollCost();
  const canAfford = player.money >= cost;
  ctx.fillStyle = canAfford ? '#88ff88' : '#ff6666';
  const cTxt = `💵 Стоимость: ${cost} монет`;
  ctx.strokeText(cTxt, p.x + 30, p.y + 132); ctx.fillText(cTxt, p.x + 30, p.y + 132);

  const lvlOk = stats.level >= ROLL_MIN_LEVEL;
  ctx.fillStyle = lvlOk ? '#88ff88' : '#ff6666';
  const lTxt = `📈 Нужен ${ROLL_MIN_LEVEL}+ уровень (твой: ${stats.level})`;
  ctx.strokeText(lTxt, p.x + 30, p.y + 164); ctx.fillText(lTxt, p.x + 30, p.y + 164);

  const now = Date.now();
  const onCooldown = now < rollCooldownUntil;
  let cdText, cdColor;
  if (onCooldown) {
    const rem = Math.ceil((rollCooldownUntil - now) / 1000);
    const m = Math.floor(rem / 60);
    const s = rem % 60;
    cdText = `⏳ Перезарядка: ${m}:${String(s).padStart(2,'0')}`;
    cdColor = '#ffaa66';
  } else {
    cdText = '✅ Готово к прокрутке';
    cdColor = '#88ff88';
  }
  ctx.fillStyle = cdColor;
  ctx.strokeText(cdText, p.x + 30, p.y + 196); ctx.fillText(cdText, p.x + 30, p.y + 196);

  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = 'bold 13px Arial';
  ctx.fillText('Шансы:', p.x + 30, p.y + 230);
  ctx.fillStyle = '#dddddd'; ctx.font = '13px Arial';
  ctx.fillText('⚪ Обычный: 50%   🟢 Необычный: 25%   🔵 Редкий: 18%', p.x + 30, p.y + 252);
  ctx.fillText('🟡 Легендарный: 5%   🔴 Мифический: 2% (Контроль)', p.x + 30, p.y + 272);

  const c = b.close;
  ctx.fillStyle = 'rgba(255,80,80,0.85)'; roundRect(c.x, c.y, c.w, c.h, 6); ctx.fill();
  ctx.fillStyle = 'white'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('✕', c.x + c.w / 2, c.y + c.h / 2);

  const btn = b.roll;
  const btnOk = !onCooldown && canAfford && lvlOk;
  ctx.fillStyle = btnOk ? 'rgba(180, 120, 255, 0.95)' : 'rgba(80,60,100,0.6)';
  roundRect(btn.x, btn.y, btn.w, btn.h, 10); ctx.fill();
  ctx.strokeStyle = btnOk ? '#e0c8ff' : 'rgba(150,120,180,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'white'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🎰 КРУТИТЬ', btn.x + btn.w / 2, btn.y + btn.h / 2);
}

function drawStatsWindow() {
  if (!statsOpen) return;
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const b = getStatsButtons();
  const p = b.panel;
  ctx.fillStyle = 'rgba(15,15,25,0.95)'; ctx.strokeStyle = 'rgba(120,180,255,0.8)'; ctx.lineWidth = 3;
  roundRect(p.x, p.y, p.w, p.h, 16); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#aaddff'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.strokeStyle = 'black'; ctx.lineWidth = 4;
  ctx.strokeText('📊 Статистика', p.x + 30, p.y + 22); ctx.fillText('📊 Статистика', p.x + 30, p.y + 22);
  ctx.fillStyle = stats.statPoints > 0 ? '#66ff66' : 'rgba(255,255,255,0.5)'; ctx.font = 'bold 18px Arial';
  const pt = `Очки: ${stats.statPoints}`;
  ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
  ctx.strokeText(pt, p.x + 30, p.y + 60); ctx.fillText(pt, p.x + 30, p.y + 60);
  const c = b.close;
  ctx.fillStyle = 'rgba(255,80,80,0.85)'; roundRect(c.x, c.y, c.w, c.h, 6); ctx.fill();
  ctx.fillStyle = 'white'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('✕', c.x + c.w / 2, c.y + c.h / 2);
  const rows = [
    { btn: b.damage, icon: '💪', name: 'Урон (кулак)', value: stats.points.damage, color: '#ff8844' },
    { btn: b.health, icon: '❤️', name: 'Здоровье', value: stats.points.health, color: '#ff4444' },
    { btn: b.fruit, icon: '🍎', name: 'Урон фрукта', value: stats.points.fruit, color: '#44ff88' }
  ];
  for (const r of rows) {
    const btn = r.btn;
    ctx.fillStyle = 'rgba(60,80,120,0.4)'; ctx.strokeStyle = 'rgba(120,160,220,0.5)'; ctx.lineWidth = 2;
    roundRect(btn.x, btn.y, btn.w, btn.h, 10); ctx.fill(); ctx.stroke();
    ctx.font = '32px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'white';
    ctx.fillText(r.icon, btn.x + 15, btn.y + btn.h / 2);
    ctx.fillStyle = r.color; ctx.font = 'bold 18px Arial'; ctx.textBaseline = 'top';
    ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
    ctx.strokeText(r.name, btn.x + 65, btn.y + 20); ctx.fillText(r.name, btn.x + 65, btn.y + 20);
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
    ctx.strokeText(`${r.value}`, btn.x + btn.w - 20, btn.y + btn.h / 2);
    ctx.fillText(`${r.value}`, btn.x + btn.w - 20, btn.y + btn.h / 2);
  }
}

function drawBag() {
  if (!bagOpen) return;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const p = getBagPanelRect();
  ctx.fillStyle = 'rgba(30,30,40,0.92)'; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
  roundRect(p.x, p.y, p.w, p.h, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'white'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('🎒 Мешок', p.x + 30, p.y + 35);
  const c = getBagCloseRect();
  ctx.fillStyle = 'rgba(255,80,80,0.85)'; roundRect(c.x, c.y, c.w, c.h, 6); ctx.fill();
  ctx.fillStyle = 'white'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('✕', c.x + c.w / 2, c.y + c.h / 2);
  const g = getBagGridRect();
  for (let r = 0; r < bagRows; r++) {
    for (let col = 0; col < bagCols; col++) {
      const x = g.x + col * (bagSlotSize + bagGap), y = g.y + r * (bagSlotSize + bagGap);
      const i = r * bagCols + col;
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      roundRect(x, y, bagSlotSize, bagSlotSize, 10); ctx.fill(); ctx.stroke();
      if (i < bag.length) {
        const item = bag[i];
        drawFruitIcon(x + bagSlotSize / 2, y + bagSlotSize / 2, bagSlotSize * 0.3, item.color);
        ctx.fillStyle = 'white'; ctx.font = '11px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText(item.name, x + bagSlotSize / 2, y + bagSlotSize - 16);
      }
    }
  }
}

function drawContextMenu() {
  if (!contextMenu) return;
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; roundRect(contextMenu.x + 4, contextMenu.y + 4, contextMenu.w, contextMenu.h, 12); ctx.fill();
  ctx.fillStyle = 'rgba(20,20,30,0.85)'; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
  roundRect(contextMenu.x, contextMenu.y, contextMenu.w, contextMenu.h, 12); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 16px Arial';
  for (const btn of contextMenu.buttons) {
    ctx.fillStyle = btn.color; roundRect(btn.x, btn.y, btn.w, btn.h, 8); ctx.fill();
    ctx.fillStyle = 'white'; ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2);
  }
}

const mousePos = { x: 0, y: 0 };
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mousePos.x = e.clientX - rect.left;
  mousePos.y = e.clientY - rect.top;
});

function drawAimCursor() {
  // Прицел обычной способности
  if (aimingAbility && !controlAim) {
    const x = mousePos.x, y = mousePos.y;
    const t = performance.now() * 0.005;
    const r = 24 + Math.sin(t * 3) * 4;
    const isFire = aimingAbility.powerName === 'Огонь';
    const isIce = aimingAbility.powerName === 'Лёд';
    const col = isFire ? 'rgba(255,150,0,0.9)' : (isIce ? 'rgba(100,200,255,0.9)' : 'rgba(80,200,255,0.9)');
    const colFill = isFire ? 'rgba(255,220,100,0.9)' : (isIce ? 'rgba(200,240,255,0.9)' : 'rgba(180,240,255,0.9)');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fillStyle = colFill; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - r - 8, y); ctx.lineTo(x - r + 4, y);
    ctx.moveTo(x + r - 4, y); ctx.lineTo(x + r + 8, y);
    ctx.moveTo(x, y - r - 8); ctx.lineTo(x, y - r + 4);
    ctx.moveTo(x, y + r - 4); ctx.lineTo(x, y + r + 8);
    ctx.stroke();
  }
  // Большой прицел для метеорита / луча
  if (controlAim) {
    const x = mousePos.x, y = mousePos.y;
    const r = controlAim.radius;
    const t = performance.now() * 0.004;
    const pulse = 1 + Math.sin(t * 3) * 0.03;
    // Заливка
    ctx.beginPath(); ctx.arc(x, y, r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = controlAim.abilityId === 'control_meteor'
      ? 'rgba(255,120,60,0.18)'
      : 'rgba(80,180,255,0.18)';
    ctx.fill();
    // Кольцо
    ctx.beginPath(); ctx.arc(x, y, r * pulse, 0, Math.PI * 2);
    ctx.strokeStyle = controlAim.color;
    ctx.lineWidth = 4; ctx.stroke();
    // Перекрестие
    ctx.strokeStyle = controlAim.color; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - r - 14, y); ctx.lineTo(x - r + 10, y);
    ctx.moveTo(x + r - 10, y); ctx.lineTo(x + r + 14, y);
    ctx.moveTo(x, y - r - 14); ctx.lineTo(x, y - r + 10);
    ctx.moveTo(x, y + r - 10); ctx.lineTo(x, y + r + 14);
    ctx.stroke();
    // Центр
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fillStyle = controlAim.color; ctx.fill();
    // Подпись
    ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const label = controlAim.abilityId === 'control_meteor' ? '☄️ Клик — метеорит' : '🔵 Клик — луч';
    ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
    ctx.strokeText(label, x, y + r + 18);
    ctx.fillStyle = 'white';
    ctx.fillText(label, x, y + r + 18);
  }
}

let toast = null;
function showToast(t) { toast = { text: t, until: performance.now() + 1500 }; }
function drawToast() {
  if (!toast) return;
  if (performance.now() > toast.until) { toast = null; return; }
  const el = toast.until - performance.now();
  const a = Math.min(1, el / 400);
  ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(toast.text).width + 50;
  const x = (canvas.width - w) / 2, y = 100;
  ctx.fillStyle = `rgba(0,0,0,${0.65 * a})`; roundRect(x, y, w, 50, 12); ctx.fill();
  ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText(toast.text, canvas.width / 2, y + 25);
}

// ==================== ГЛАВНЫЙ ЦИКЛ ====================
function gameLoop() {
  if (currentUser) {
    update();
    drawWorld();
    drawObstacles();
    drawDroppedFruits();
    drawIceFields();
    drawIceZones();
    drawWhirlpools();
    drawWhirlpoolTentacles();
    drawControlZones();
    drawControlLasers();
    drawControlMeteors();
    drawControlBeams();
    drawQuestNpc();
    drawRollNpc();
    drawNpc();
    drawPirates();
    drawRemotePlayers();
    drawMeteors();
    drawSharkBites();
    drawWhipTrails();
    drawParticles();
    drawProjectiles();
    drawDashTrail();
    drawPlayer();
    drawHeldItem();
    drawDamageNumbers();
    drawInventory();
    drawPlayerStats();
    drawAbilityGuide();
    drawActiveQuest();
    drawLevelUi();
    drawContextMenu();
    drawBag();
    drawAimCursor();
    drawQuestDialog();
    drawRollDialog();
    drawStatsWindow();
    drawAdminConsole();
    drawToast();
  } else {
    ctx.fillStyle = '#0a1a3a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
